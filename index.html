<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생두 물리 측정 결과 입력기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .active-chip { background-color: #059669 !important; color: white !important; border-color: #059669 !important; }
    .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; }
    .accordion-content:not(.closed) { overflow: visible !important; }
    .accordion-content.closed { max-height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; overflow: hidden !important; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .search-select-dropdown { max-height: 192px; overflow-y: auto; z-index: 50; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 font-sans text-gray-800">

  <div class="max-w-md mx-auto px-4 pt-4">

    <!-- Header -->
    <header class="mb-4 flex justify-between items-center border-b pb-3 bg-white p-3 rounded-xl shadow-sm">
      <div>
        <h1 class="text-base font-bold text-gray-900">생두 물리 측정 결과 입력기</h1>
        <p class="text-[10px] text-emerald-600 font-semibold">Q.C Data-Driven System</p>
      </div>
      <button type="button" onclick="openBeanModal()" class="px-2.5 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 font-bold text-xs rounded-lg transition-all flex items-center gap-1 shadow-sm">
        🔍 기존 정보
      </button>
    </header>

    <!-- 임시저장 목록 노출 바 -->
    <div id="draftListContainer" class="mb-4 hidden">
      <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl space-y-1.5">
        <label class="block font-bold text-amber-900 text-xs flex justify-between items-center">
          <span>📁 진행 중인 임시저장 불러오기</span>
          <span id="draftCountBadge" class="text-[10px] bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded-full font-bold">0건</span>
        </label>
        <select id="draftSelect" onchange="loadSelectedDraft()" class="w-full p-2 border border-amber-300 rounded-lg text-xs bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-amber-500">
          <option value="">-- 불러올 임시저장 세트를 선택하세요 --</option>
        </select>
      </div>
    </div>

    <!-- 입력 폼 -->
    <form id="qcForm" onsubmit="event.preventDefault();" class="space-y-3 text-xs">
      <input type="hidden" id="currentSetId" value="">

      <!-- Group 1: 기본 정보 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span>1. 기본 정보</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2 text-xs">
          <div>
            <label class="block font-semibold mb-0.5">커피 이름 *</label>
            <input type="text" id="coffeeName" required placeholder="예: 2024 콜롬비아 게이샤" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none">
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">측정일자</label>
              <input type="date" id="measureDate" onchange="extractYearMonth()" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">측정연도</label>
              <input type="number" id="measureYear" class="w-full p-1.5 border rounded-lg bg-gray-50" readonly>
            </div>
            <div>
              <label class="block font-semibold mb-0.5">측정월</label>
              <input type="number" id="measureMonth" class="w-full p-1.5 border rounded-lg bg-gray-50" readonly>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">수확연도</label>
              <input type="text" id="harvestYear" placeholder="2024/2025" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">측정목적</label>
              <input type="text" id="measurePurpose" placeholder="QC / 입고검사" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">공급사</label>
              <div class="relative">
                <input type="text" id="supplier_search" placeholder="검색 및 선택..." onclick="toggleSearchSelect('supplier_dropdown')" oninput="filterSearchSelect('supplier_search', 'supplier_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="supplier" value="">
                <div id="supplier_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-xl z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Group 2: 생산 정보 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span>2. 생산 정보 (연동 필터링)</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">국가 *</label>
              <div class="relative">
                <input type="text" id="country_search" placeholder="국가 검색..." onclick="toggleSearchSelect('country_dropdown')" oninput="filterSearchSelect('country_search', 'country_dropdown'); onCountryInputChange();" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="country" value="">
                <div id="country_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-xl z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
            <div>
              <label class="block font-semibold mb-0.5">농장</label>
              <div class="relative">
                <input type="text" id="farm_search" placeholder="농장 검색..." onclick="toggleSearchSelect('farm_dropdown')" oninput="filterSearchSelect('farm_search', 'farm_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="farm" value="">
                <div id="farm_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-xl z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">농장 비고</label>
              <input type="text" id="farmNotes" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">생산자</label>
              <div class="relative">
                <input type="text" id="producer_search" placeholder="생산자 검색..." onclick="toggleSearchSelect('producer_dropdown')" oninput="filterSearchSelect('producer_search', 'producer_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="producer" value="">
                <div id="producer_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-xl z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
          </div>
          <div>
            <label class="block font-semibold mb-0.5">생산자 비고</label>
            <input type="text" id="producerNotes" class="w-full p-1.5 border rounded-lg">
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">상위 지역</label>
              <div class="relative">
                <input type="text" id="regionUpper_search" placeholder="상위 지역..." onclick="toggleSearchSelect('regionUpper_dropdown')" oninput="filterSearchSelect('regionUpper_search', 'regionUpper_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="regionUpper" value="">
                <div id="regionUpper_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-xl z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
            <div>
              <label class="block font-semibold mb-0.5">하위 지역</label>
              <div class="relative">
                <input type="text" id="regionLower_search" placeholder="하위 지역..." onclick="toggleSearchSelect('regionLower_dropdown')" oninput="filterSearchSelect('regionLower_search', 'regionLower_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="regionLower" value="">
                <div id="regionLower_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-xl z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
            <div>
              <label class="block font-semibold mb-0.5">지역 비고</label>
              <input type="text" id="regionNotes" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">재배고도 최저 (m)</label>
              <input type="number" id="altMin" placeholder="1500" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">재배고도 최고 (m)</label>
              <input type="number" id="altMax" placeholder="1800" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
        </div>
      </div>

      <!-- Group 3: 프로세싱 정보 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span>3. 프로세싱 정보</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2 text-xs">
          <button type="button" onclick="openProcessSetModal()" class="w-full py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold rounded-lg hover:bg-emerald-100 transition-all flex items-center justify-center gap-1">
            ⚙ 프로세싱 세트 불러오기 (팝업)
          </button>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">대분류</label>
              <select id="processMain" class="w-full p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="Washed">Washed</option>
                <option value="Natural">Natural</option>
                <option value="Honey/PN">Honey/PN</option>
                <option value="Semi Washed/White Honey">Semi Washed/White Honey</option>
                <option value="Experimental/Other">Experimental/Other</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold mb-0.5">발효 타입</label>
              <select id="fermentationType" class="w-full p-1.5 border rounded-lg bg-white">
                <option value="Aerobic">Aerobic</option>
                <option value="Anaerobic">Anaerobic</option>
                <option value="Mixed">Mixed</option>
                <option value="None">None</option>
              </select>
            </div>
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="font-semibold">소분류 (태그 선택)</label>
              <button type="button" onclick="clearSelectedSubChips()" class="text-[10px] text-red-600 font-bold">전체 해제</button>
            </div>
            <div id="subChipContainer" class="flex flex-wrap gap-1 mb-1.5 max-h-36 overflow-y-auto p-1.5 border rounded bg-gray-50">
              <span class="text-gray-400 text-[11px] py-1">DB_프로세싱 로딩 중...</span>
            </div>
            <div class="flex gap-1">
              <input type="text" id="customSubInput" placeholder="+ 직접 입력 후 태그 추가" class="flex-1 p-1 border rounded text-[11px]">
              <button type="button" onclick="addCustomSubChip()" class="px-2 py-1 bg-gray-200 text-gray-700 font-bold rounded text-[11px]">추가</button>
            </div>
          </div>
          <div>
            <label class="block font-semibold mb-0.5">프로세싱 비고</label>
            <input type="text" id="processNotes" class="w-full p-1.5 border rounded-lg">
          </div>
        </div>
      </div>

      <!-- Group 4: 품종 정보 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span>4. 품종 정보 (DB 실시간 동적 바인딩)</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2.5 text-xs">
          <div class="flex justify-between items-center">
            <button type="button" onclick="openAddVarietyModal()" class="px-2 py-1 bg-emerald-600 text-white font-bold text-[11px] rounded-lg shadow-sm hover:bg-emerald-700 transition-all flex items-center gap-1">
              ➕ 신규 품종 DB 등록
            </button>
            <button type="button" onclick="clearSelectedVarietyChips()" class="text-[10px] text-red-600 font-bold">선택 해제</button>
          </div>

          <!-- 품종 아코디언 컨테이너 -->
          <div id="varietyGroupContainer" class="space-y-1.5 max-h-80 overflow-y-auto pr-1">
            <span class="text-gray-400 text-[11px]">DB_품종 데이터 로딩 중...</span>
          </div>

          <div>
            <label class="block font-semibold mb-0.5">품종 비고</label>
            <input type="text" id="varietyNotes" class="w-full p-1.5 border rounded-lg">
          </div>
        </div>
      </div>

      <!-- Group 5: 측정 데이터 (장비 & 실측 데이터) -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-emerald-700 text-white flex justify-between font-bold text-xs rounded-t-xl" onclick="toggleAcc(this)">
          <span>5. 장비 측정 및 개별 실측 데이터</span> <span class="arrow text-white">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-4 text-xs">
          
          <!-- Omix -->
          <div class="p-2.5 bg-emerald-50/50 border border-emerald-200 rounded-lg space-y-2">
            <label class="block font-bold text-emerald-900 border-b border-emerald-200 pb-1">📊 Omix 측정 데이터</label>
            <div class="grid grid-cols-3 gap-1.5">
              <div>
                <label class="block text-[10px] text-gray-600">수분 (%)</label>
                <input type="number" step="0.01" id="omixMoisture" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">밀도 (g/L)</label>
                <input type="number" step="0.1" id="omixDensity" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">추정 밀도 (g/L)</label>
                <input type="number" step="0.1" id="omixEstDensity" class="w-full p-1 border rounded text-xs">
              </div>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
              <div>
                <label class="block text-[10px] text-gray-600">스크린 작음</label>
                <input type="number" step="0.1" id="omixScreenSmall" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">스크린 큼</label>
                <input type="number" step="0.1" id="omixScreenLarge" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">추정 부피 (mm³)</label>
                <input type="number" step="0.1" id="omixEstVolume" class="w-full p-1 border rounded text-xs">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-1.5">
              <div>
                <label class="block text-[10px] text-gray-600">수분활성도 (aW)</label>
                <input type="number" step="0.001" id="omixAw" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">빈 온도 (°C)</label>
                <input type="number" step="0.1" id="omixBeanTemp" class="w-full p-1 border rounded text-xs">
              </div>
            </div>
            <!-- Omix 환경 세트 -->
            <div class="p-2 bg-white border rounded-lg space-y-1">
              <label class="block text-[10px] font-bold text-gray-700">🌡 Omix 환경 데이터 (고정 유지)</label>
              <div class="grid grid-cols-4 gap-1">
                <div>
                  <label class="block text-[9px] text-gray-500">공기온도 (°C)</label>
                  <input type="number" step="0.1" id="omixAirTemp" oninput="saveEnvData()" class="w-full p-1 border rounded text-[11px] bg-amber-50/50">
                </div>
                <div>
                  <label class="block text-[9px] text-gray-500">습도 (%)</label>
                  <input type="number" step="0.1" id="omixHumidity" oninput="saveEnvData()" class="w-full p-1 border rounded text-[11px] bg-amber-50/50">
                </div>
                <div>
                  <label class="block text-[9px] text-gray-500">기압 (hPa)</label>
                  <input type="number" step="0.1" id="omixPressure" oninput="saveEnvData()" class="w-full p-1 border rounded text-[11px] bg-amber-50/50">
                </div>
                <div>
                  <label class="block text-[9px] text-gray-500">고도 (m)</label>
                  <input type="number" step="1" id="omixAltitude" oninput="saveEnvData()" class="w-full p-1 border rounded text-[11px] bg-amber-50/50">
                </div>
              </div>
            </div>
          </div>

          <!-- M1 & MD-500 -->
          <div class="grid grid-cols-2 gap-2">
            <div class="p-2 bg-blue-50/50 border border-blue-200 rounded-lg space-y-1.5">
              <label class="block font-bold text-blue-900">💧 CoffMeter M1</label>
              <div>
                <label class="block text-[10px] text-gray-600">수분 (%)</label>
                <input type="number" step="0.01" id="m1Moisture" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">밀도 (g/L)</label>
                <input type="number" step="0.1" id="m1Density" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">공기온도 (°C)</label>
                <input type="number" step="0.1" id="m1AirTemp" class="w-full p-1 border rounded text-xs">
              </div>
            </div>
            <div class="p-2 bg-indigo-50/50 border border-indigo-200 rounded-lg space-y-1.5">
              <label class="block font-bold text-indigo-900">🔬 Lighttells MD-500</label>
              <div>
                <label class="block text-[10px] text-gray-600">수분 (%)</label>
                <input type="number" step="0.01" id="md500Moisture" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">밀도 (g/L)</label>
                <input type="number" step="0.1" id="md500Density" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">공기온도 (°C)</label>
                <input type="number" step="0.1" id="md500AirTemp" class="w-full p-1 border rounded text-xs">
              </div>
            </div>
          </div>

          <!-- Rotronic -->
          <div class="p-2 bg-purple-50/50 border border-purple-200 rounded-lg space-y-1.5">
            <label class="block font-bold text-purple-900">🌡 Rotronic 수분활성도</label>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-gray-600">수분활성도 (aW)</label>
                <input type="number" step="0.001" id="rotronicAw" class="w-full p-1 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[10px] text-gray-600">측정 온도 (°C)</label>
                <input type="number" step="0.1" id="rotronicAwTemp" class="w-full p-1 border rounded text-xs">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-gray-500">aW Offset (고정)</label>
                <input type="number" step="0.001" id="rotronicAwOffset" oninput="saveEnvData()" class="w-full p-1 border rounded text-xs bg-amber-50/50">
              </div>
              <div>
                <label class="block text-[10px] text-gray-500">Temp Offset (고정)</label>
                <input type="number" step="0.1" id="rotronicTempOffset" oninput="saveEnvData()" class="w-full p-1 border rounded text-xs bg-amber-50/50">
              </div>
            </div>
          </div>

          <!-- 감각 검사 -->
          <div class="p-2.5 bg-gray-100 border border-gray-300 rounded-lg space-y-2">
            <label class="block font-bold text-gray-800">🖐 감각 판단 (1~5단계)</label>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] font-bold mb-1">감각 부피 (1~5)</label>
                <div class="flex items-center gap-1">
                  <button type="button" onclick="stepSensory('sensoryVolume', -1)" class="px-2 py-1 bg-white border rounded font-bold">-</button>

                <label class="block text-[11px] font-bold mb-1">감각 경도 (1~5)</label>

                  <input type="number" min="1" max="5" id="sensoryHardness" value="3" class="w-full p-1 text-center font-bold border rounded bg-white">
                  <button type="button" onclick="stepSensory('sensoryHardness', 1)" class="px-2 py-1 bg-white border rounded font-bold">+</button>
                </div>

          <!-- 20알 실측 그리드 (단일 행 저장) -->

              <button type="button" onclick="clear20BeanGrid()" class="text-[10px] text-red-600 font-bold">실측 초기화</button>

        <div class="max-w-md mx-auto flex gap-2">
          <button type="button" onclick="submitData('Draft')" class="w-1/3 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow transition-all">
            💾 임시 저장
          </button>
          <button type="button" onclick="submitData('Completed')" class="w-2/3 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg transition-all">

  <!-- 신규 품종 DB 등록 모달 -->

        <label class="block font-bold mb-0.5">1. 종 *</label>

        <label class="block font-bold mb-0.5">2. 품종 그룹 (동적 로딩) *</label>

        <button type="button" onclick="saveNewVarietyToDB()" class="w-1/2 py-2 bg-emerald-600 text-white font-bold rounded-lg">DB 저장</button>
      </div>

  </div>

  <!-- 프로세싱 세트 불러오기 팝업 모달 -->
  <div id="processSetModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-4 space-y-3 text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-gray-800">⚙ 프로세싱 세트 불러오기</h3>
        <button type="button" onclick="closeProcessSetModal()" class="text-gray-400 font-bold hover:text-gray-600">✕</button>
      </div>
      <input type="text" id="processSetSearch" oninput="filterProcessSetModalList()" placeholder="세트 키워드 검색..." class="w-full p-2 border rounded-lg">
      <div id="processSetModalList" class="max-h-72 overflow-y-auto space-y-1.5 border p-2 rounded-lg bg-gray-50"></div>
    </div>
  </div>

  <!-- 기존 생두 정보 불러오기 모달 -->
  <div id="beanModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-4 space-y-3 text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-gray-800">🔍 기존 생두 정보 불러오기</h3>
        <button type="button" onclick="closeBeanModal()" class="text-gray-400 font-bold hover:text-gray-600">✕</button>
      </div>
      <input type="text" id="beanSearch" oninput="filterBeanModalList()" placeholder="커피 이름 / 국가 / 농장 / 품종 검색..." class="w-full p-2 border rounded-lg">
      <div id="beanModalList" class="max-h-80 overflow-y-auto space-y-1.5 border p-2 rounded-lg bg-gray-50"></div>
    </div>
  </div>

  <script>
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbweqeTQLMbmCuCckojMxba4JN-6UbcB-HPiQXO0EoLgGl9w6ie_sAdUdQAzyUNyPQ/exec";

    let dbCache = {};
    let cachedDrafts = [];
    let cachedProcessSets = [];
    let cachedBeans = [];
    let selectedSubQueue = [];
    let selectedVarietyQueue = [];

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('measureDate').value = new Date().toISOString().substring(0, 10);
      extractYearMonth();
      build20BeanGrid();
      loadEnvData();

      if (!GOOGLE_WEB_APP_URL.includes("여기에_")) {
        loadDraftList();
        loadDBLists();
      }
    });

    function toggleAcc(btn) {
      const content = btn.nextElementSibling;
      const arrow = btn.querySelector('.arrow');
      content.classList.toggle('closed');
      arrow.textContent = content.classList.contains('closed') ? '▼' : '▲';
    }

    function extractYearMonth() {
      const d = document.getElementById('measureDate').value;
      if (d) {
        const parts = d.split('-');
        if (parts.length >= 2) {
          document.getElementById('measureYear').value = parseInt(parts[0], 10);
          document.getElementById('measureMonth').value = parseInt(parts[1], 10);
        }
      }
    }

    function stepSensory(id, delta) {
      const el = document.getElementById(id);
      if (!el) return;
      let val = parseInt(el.value, 10) || 3;
      val += delta;
      if (val < 1) val = 1;
      if (val > 5) val = 5;
      el.value = val;
    }

    // 환경 고정 데이터 로컬 스토리지 유지
    function saveEnvData() {
      const env = {
        airTemp: document.getElementById('omixAirTemp').value,
        humidity: document.getElementById('omixHumidity').value,
        pressure: document.getElementById('omixPressure').value,
        altitude: document.getElementById('omixAltitude').value,
        awOffset: document.getElementById('rotronicAwOffset').value,
        tempOffset: document.getElementById('rotronicTempOffset').value
      };
      localStorage.setItem('qc_env_data', JSON.stringify(env));
    }

    function loadEnvData() {
      try {
        const saved = localStorage.getItem('qc_env_data');
        if (saved) {
          const env = JSON.parse(saved);
          if (env.airTemp) document.getElementById('omixAirTemp').value = env.airTemp;
          if (env.humidity) document.getElementById('omixHumidity').value = env.humidity;
          if (env.pressure) document.getElementById('omixPressure').value = env.pressure;
          if (env.altitude) document.getElementById('omixAltitude').value = env.altitude;
          if (env.awOffset) document.getElementById('rotronicAwOffset').value = env.awOffset;
          if (env.tempOffset) document.getElementById('rotronicTempOffset').value = env.tempOffset;
        }
      } catch (e) {}
    }

    // 20알 개별 실측 입력 그리드 생성
    function build20BeanGrid() {
      const container = document.getElementById('bean20Grid');
      if (!container) return;
      container.innerHTML = '';

      for (let i = 1; i <= 20; i++) {
        const row = document.createElement('div');
        row.className = 'grid grid-cols-5 gap-1 items-center bg-white p-1 rounded border text-[11px]';
        row.innerHTML = `
          <span class="font-bold text-gray-500 text-center">#${i}</span>
          <input type="number" step="0.01" id="bLen_${i}" placeholder="길이" class="p-1 border rounded text-center">
          <input type="number" step="0.01" id="bWid_${i}" placeholder="폭" class="p-1 border rounded text-center">
          <input type="number" step="0.01" id="bThk_${i}" placeholder="두께" class="p-1 border rounded text-center">
          <input type="number" step="0.1" id="bHrd_${i}" placeholder="경도" class="p-1 border rounded text-center">
        `;
        container.appendChild(row);
      }
    }

    function clear20BeanGrid() {
      for (let i = 1; i <= 20; i++) {
        document.getElementById(`bLen_${i}`).value = '';
        document.getElementById(`bWid_${i}`).value = '';
        document.getElementById(`bThk_${i}`).value = '';
        document.getElementById(`bHrd_${i}`).value = '';
      }
    }

    // DB 로딩
    function loadDBLists() {
      fetch(`${GOOGLE_WEB_APP_URL}?action=getDB`)
        .then(res => res.json())
        .then(data => {
          dbCache = data || {};
          populateSearchSelectData('supplier_dropdown', data.supplier, 0, 'supplier');
          populateSearchSelectData('country_dropdown', data.country, 0, 'country', onCountryChange);

          // 농장, 상위지역, 하위지역 필터링 상태 업데이트
          onCountryChange('');

          // 품종 아코디언 DB 동적 렌더링
          renderVarietyGroupChips(data.variety);

          // 프로세싱 소분류 태그 DB 동적 렌더링
          renderProcessSubChips(data.processing);

          // 신규 품종 등록 모달의 품종 그룹 드롭다운 업데이트
          onNewVarSpeciesChange();
        }).catch(err => console.error(err));
    }

    // 검색 결합형 드롭다운 기본 로직
    function populateSearchSelectData(dropdownId, arr, colIdx, hiddenId, onSelectCallback = null) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      dropdown.innerHTML = '';
      if (!arr || !Array.isArray(arr)) return;

      const set = new Set();
      for (let i = 1; i < arr.length; i++) {
        const val = String(arr[i][colIdx] || '').trim();
        if (val && !set.has(val)) {
          set.add(val);
          const item = document.createElement('div');
          item.className = 'p-1.5 hover:bg-emerald-50 cursor-pointer rounded font-medium text-gray-700';
          item.textContent = val;
          item.onclick = function() {
            document.getElementById(hiddenId + '_search').value = val;
            document.getElementById(hiddenId).value = val;
            toggleSearchSelect(dropdownId, false);
            if (onSelectCallback) onSelectCallback(val);
          };
          dropdown.appendChild(item);
        }
      }
    }

    function toggleSearchSelect(dropdownId, forceState = null) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      if (forceState !== null) {
        if (forceState) dropdown.classList.remove('hidden');
        else dropdown.classList.add('hidden');
      } else {
        dropdown.classList.toggle('hidden');
      }
    }

    function filterSearchSelect(inputId, dropdownId) {
      const q = document.getElementById(inputId).value.trim().toLowerCase();
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      dropdown.classList.remove('hidden');

      const children = dropdown.children;
      for (let child of children) {
        const txt = child.textContent.trim().toLowerCase();
        if (txt.includes(q)) child.style.display = 'block';
        else child.style.display = 'none';
      }
    }

    function onCountryInputChange() {
      const typedVal = document.getElementById('country_search').value.trim();
      document.getElementById('country').value = typedVal;
      onCountryChange(typedVal);
    }

    function onCountryChange(cVal) {
      const selectedCountry = cVal || document.getElementById('country').value || document.getElementById('country_search').value || '';
      
      populateFilteredFarmSelect(selectedCountry);
      populateFilteredUpperRegionSelect(selectedCountry);
      populateFilteredLowerRegionSelect(selectedCountry, '');
    }

    function populateFilteredFarmSelect(cVal) {
      const dropdown = document.getElementById('farm_dropdown');
      if (!dropdown) return;
      dropdown.innerHTML = '';

      if (!cVal) {
        dropdown.innerHTML = '<div class="p-2 text-gray-400 italic">국가를 먼저 선택해 주세요.</div>';
        return;
      }

      if (!dbCache.farm || !Array.isArray(dbCache.farm)) return;

      let count = 0;
      for (let i = 1; i < dbCache.farm.length; i++) {
        const country = String(dbCache.farm[i][0] || '').trim().toLowerCase();
        const farmName = String(dbCache.farm[i][1] || '').trim();
        const producer = String(dbCache.farm[i][3] || '').trim();

        if (country === cVal.toLowerCase() && farmName) {
          count++;
          const item = document.createElement('div');
          item.className = 'p-1.5 hover:bg-emerald-50 cursor-pointer rounded font-medium text-gray-700 flex justify-between';
          item.innerHTML = `<span>${farmName}</span> <span class="text-[10px] text-gray-400">${producer}</span>`;
          item.onclick = function() {
            document.getElementById('farm_search').value = farmName;
            document.getElementById('farm').value = farmName;
            toggleSearchSelect('farm_dropdown', false);
            onFarmChange(farmName);
          };
          dropdown.appendChild(item);
        }
      }

      if (count === 0) {
        dropdown.innerHTML = `<div class="p-2 text-gray-400 italic">선택한 국가(${cVal})의 농장 DB가 없습니다.</div>`;
      }
    }

    function populateFilteredUpperRegionSelect(cVal) {
      const dropdown = document.getElementById('regionUpper_dropdown');
      if (!dropdown) return;
      dropdown.innerHTML = '';

      if (!cVal) {
        dropdown.innerHTML = '<div class="p-2 text-gray-400 italic">국가를 먼저 선택해 주세요.</div>';
        return;
      }

      if (!dbCache.region || !Array.isArray(dbCache.region)) return;

      const set = new Set();
      for (let i = 1; i < dbCache.region.length; i++) {
        const country = String(dbCache.region[i][0] || '').trim().toLowerCase();
        const upperReg = String(dbCache.region[i][1] || '').trim();

        if (country === cVal.toLowerCase() && upperReg && !set.has(upperReg)) {
          set.add(upperReg);
          const item = document.createElement('div');
          item.className = 'p-1.5 hover:bg-emerald-50 cursor-pointer rounded font-medium text-gray-700';
          item.textContent = upperReg;
          item.onclick = function() {
            document.getElementById('regionUpper_search').value = upperReg;
            document.getElementById('regionUpper').value = upperReg;
            toggleSearchSelect('regionUpper_dropdown', false);
            populateFilteredLowerRegionSelect(cVal, upperReg);
          };
          dropdown.appendChild(item);
        }
      }

      if (set.size === 0) {
        dropdown.innerHTML = `<div class="p-2 text-gray-400 italic">선택한 국가(${cVal})의 상위 지역 DB가 없습니다.</div>`;
      }
    }

    function populateFilteredLowerRegionSelect(cVal, upperReg) {
      const dropdown = document.getElementById('regionLower_dropdown');
      if (!dropdown) return;
      dropdown.innerHTML = '';

      if (!upperReg) {
        dropdown.innerHTML = '<div class="p-2 text-gray-400 italic">상위 지역을 먼저 선택해 주세요.</div>';
        return;
      }

      if (!dbCache.region || !Array.isArray(dbCache.region)) return;

      const set = new Set();
      for (let i = 1; i < dbCache.region.length; i++) {
        const country = String(dbCache.region[i][0] || '').trim().toLowerCase();
        const uReg = String(dbCache.region[i][1] || '').trim().toLowerCase();
        const lowerReg = String(dbCache.region[i][2] || '').trim();

        if ((!cVal || country === cVal.toLowerCase()) && uReg === upperReg.toLowerCase() && lowerReg && !set.has(lowerReg)) {
          set.add(lowerReg);
          const item = document.createElement('div');
          item.className = 'p-1.5 hover:bg-emerald-50 cursor-pointer rounded font-medium text-gray-700';
          item.textContent = lowerReg;
          item.onclick = function() {
            document.getElementById('regionLower_search').value = lowerReg;
            document.getElementById('regionLower').value = lowerReg;
            toggleSearchSelect('regionLower_dropdown', false);
          };
          dropdown.appendChild(item);
        }
      }

      if (set.size === 0) {
        dropdown.innerHTML = `<div class="p-2 text-gray-400 italic">선택한 상위 지역(${upperReg})의 하위 지역 DB가 없습니다.</div>`;
      }
    }

    function onFarmChange(fName) {
      if (!dbCache.farm) return;
      for (let i = 1; i < dbCache.farm.length; i++) {
        const farmName = String(dbCache.farm[i][1] || '').trim();
        if (farmName.toLowerCase() === fName.toLowerCase()) {
          const farmNotes = String(dbCache.farm[i][2] || '').trim();
          const producer = String(dbCache.farm[i][3] || '').trim();
          const upperReg = String(dbCache.farm[i][4] || '').trim();
          const lowerReg = String(dbCache.farm[i][5] || '').trim();

          if (farmNotes) document.getElementById('farmNotes').value = farmNotes;
          if (producer) {
            document.getElementById('producer_search').value = producer;
            document.getElementById('producer').value = producer;
          }
          if (upperReg) {
            document.getElementById('regionUpper_search').value = upperReg;
            document.getElementById('regionUpper').value = upperReg;
            populateFilteredLowerRegionSelect(document.getElementById('country').value, upperReg);
          }
          if (lowerReg) {
            document.getElementById('regionLower_search').value = lowerReg;
            document.getElementById('regionLower').value = lowerReg;
          }
          break;
        }
      }
    }

    // DB_품종 시트 데이터를 읽어 동적 그룹핑 렌더링
    function renderVarietyGroupChips(varietyArr) {
      const container = document.getElementById('varietyGroupContainer');
      if (!container) return;
      container.innerHTML = '';

      if (!varietyArr || !Array.isArray(varietyArr) || varietyArr.length <= 1) {
        container.innerHTML = '<div class="text-xs text-gray-400 p-2">DB_품종 시트에 등록된 데이터가 없습니다.</div>';
        return;
      }

      const groups = {};

      for (let i = 1; i < varietyArr.length; i++) {
        const vName = String(varietyArr[i][0] || '').trim();
        const species = String(varietyArr[i][1] || '').trim() || 'Arabica';
        if (!vName) continue;

        let groupKey = species;
        if (species.toLowerCase() === 'arabica') {
          const firstChar = vName.charAt(0).toUpperCase();
          if (/[0-9]/.test(firstChar)) {
            groupKey = 'Arabica 0-9';
          } else if (/[A-Z]/.test(firstChar)) {
            groupKey = 'Arabica ' + firstChar;
          } else {
            groupKey = 'Arabica 기타';
          }
        }

        if (!groups[groupKey]) groups[groupKey] = [];
        if (!groups[groupKey].includes(vName)) groups[groupKey].push(vName);
      }

      const sortedKeys = Object.keys(groups).sort((a, b) => a.localeCompare(b));

      sortedKeys.forEach(groupKey => {
        const items = groups[groupKey].sort((a, b) => a.localeCompare(b));
        
        const details = document.createElement('details');
        details.className = 'border rounded-lg bg-white overflow-hidden text-xs';
        
        const summary = document.createElement('summary');
        summary.className = 'p-2 font-bold text-gray-700 bg-gray-50 cursor-pointer hover:bg-emerald-50 select-none flex justify-between items-center';
        summary.innerHTML = `<span>🏷 ${groupKey}</span> <span class="text-[10px] text-gray-400">(${items.length})</span>`;
        
        const contentBox = document.createElement('div');
        contentBox.className = 'p-2 flex flex-wrap gap-1 bg-white border-t';

        items.forEach(vName => {
          createVarietyChipElement(vName, contentBox);
        });

        details.appendChild(summary);
        details.appendChild(contentBox);
        container.appendChild(details);
      });
    }

    function createVarietyChipElement(val, container) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'variety-chip px-2 py-1 border rounded-lg text-[11px] bg-white text-gray-700 font-medium hover:bg-emerald-50 transition-all';
      btn.dataset.val = val;
      btn.textContent = val;
      btn.onclick = function() { toggleVarietyChipQueue(this); };
      container.appendChild(btn);
    }

    function toggleVarietyChipQueue(btn) {
      const val = btn.dataset.val;
      const idx = selectedVarietyQueue.indexOf(val);
      if (idx > -1) {
        selectedVarietyQueue.splice(idx, 1);
        btn.classList.remove('active-chip');
      } else {
        selectedVarietyQueue.push(val);
        btn.classList.add('active-chip');
      }
    }

    function clearSelectedVarietyChips() {
      selectedVarietyQueue = [];
      document.querySelectorAll('.variety-chip').forEach(b => b.classList.remove('active-chip'));
    }

    function getSelectedVariety() {
      return selectedVarietyQueue.join(', ');
    }

    function setSelectedVariety(str) {
      clearSelectedVarietyChips();
      if (!str) return;
      const list = String(str).split(',').map(s => s.trim());
      list.forEach(val => {
        if (!val) return;
        let btn = document.querySelector(`.variety-chip[data-val="${val}"]`);
        if (btn && !selectedVarietyQueue.includes(val)) {
          selectedVarietyQueue.push(val);
          btn.classList.add('active-chip');
        }
      });
    }

    function openAddVarietyModal() {
      document.getElementById('varietyModal').classList.remove('hidden');
      onNewVarSpeciesChange();
    }
    function closeAddVarietyModal() {
      document.getElementById('varietyModal').classList.add('hidden');
    }

    function onNewVarSpeciesChange() {
      const species = document.getElementById('newVarSpecies').value.trim().toLowerCase();
      const groupSel = document.getElementById('newVarGroup');
      groupSel.innerHTML = '';

      if (!dbCache.variety || !Array.isArray(dbCache.variety)) {
        groupSel.innerHTML = '<option value="Ethiopia">Ethiopia</option><option value="Typica/Bourbon">Typica/Bourbon</option><option value="Hybrid">Hybrid</option>';
        return;
      }

      const set = new Set();
      for (let i = 1; i < dbCache.variety.length; i++) {
        const rowSpecies = String(dbCache.variety[i][1] || '').trim().toLowerCase();
        const rowGroup = String(dbCache.variety[i][2] || '').trim();

        if (rowSpecies === species && rowGroup && !set.has(rowGroup)) {
          set.add(rowGroup);
          groupSel.innerHTML += `<option value="${rowGroup}">${rowGroup}</option>`;
        }
      }
      if (set.size === 0) {
        groupSel.innerHTML = `<option value="Ethiopia">Ethiopia</option><option value="Typica/Bourbon">Typica/Bourbon</option><option value="Hybrid">Hybrid</option><option value="Unknown">Unknown</option>`;
      }
    }

    // DB_프로세싱 시트 B열 소분류 동적 바인딩
    function renderProcessSubChips(arr) {
      const container = document.getElementById('subChipContainer');
      if (!container || !arr || !Array.isArray(arr)) return;
      container.innerHTML = '';
      const set = new Set();
      
      for (let i = 1; i < arr.length; i++) {
        const subVal = String(arr[i][1] || '').trim();
        if (subVal && !set.has(subVal)) {
          set.add(subVal);
        }
      }

      const sortedList = Array.from(set).sort((a, b) => a.localeCompare(b));
      if (sortedList.length === 0) {
        container.innerHTML = '<div class="text-xs text-gray-400 p-1">DB_프로세싱 시트에 등록된 소분류가 없습니다.</div>';
        return;
      }

      sortedList.forEach(subVal => {
        createSubChipElement(subVal, container);
      });
    }

    function createSubChipElement(val, container) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sub-chip px-2 py-1 border rounded-lg text-[11px] bg-gray-100 text-gray-700 font-medium transition-all';
      btn.dataset.val = val;
      btn.textContent = val;
      btn.onclick = function() { toggleSubChipQueue(this); };
      container.appendChild(btn);
    }

    function toggleSubChipQueue(btn) {
      const val = btn.dataset.val;
      const idx = selectedSubQueue.indexOf(val);
      if (idx > -1) {
        selectedSubQueue.splice(idx, 1);
        btn.classList.remove('active-chip');
      } else {
        selectedSubQueue.push(val);
        btn.classList.add('active-chip');
      }
    }

    function addCustomSubChip() {
      const val = document.getElementById('customSubInput').value.trim();
      if (!val) return;
      const container = document.getElementById('subChipContainer');
      createSubChipElement(val, container);
      const newBtn = container.lastElementChild;
      toggleSubChipQueue(newBtn);
      document.getElementById('customSubInput').value = '';
    }

    function clearSelectedSubChips() {
      selectedSubQueue = [];
      document.querySelectorAll('.sub-chip').forEach(b => b.classList.remove('active-chip'));
    }

    function getSelectedProcessSub() {
      return selectedSubQueue.join(', ');
    }

    function setSelectedProcessSub(str) {
      clearSelectedSubChips();
      if (!str) return;
      const list = String(str).split(',').map(s => s.trim());
      list.forEach(val => {
        if (!val) return;
        let btn = document.querySelector(`.sub-chip[data-val="${val}"]`);
        if (btn && !selectedSubQueue.includes(val)) {
          selectedSubQueue.push(val);
          btn.classList.add('active-chip');
        }
      });
    }

    function submitData(statusMode) {
      if (GOOGLE_WEB_APP_URL.includes("여기에_")) {
        alert("🛑 GOOGLE_WEB_APP_URL을 등록해 주세요.");
        return;
      }
      const coffeeName = document.getElementById('coffeeName').value.trim();
      if (!coffeeName) {
        alert("⚠ 커피 이름을 입력해 주세요.");
        return;
      }

      const currentSetId = document.getElementById('currentSetId').value || ("SET_" + Date.now());
      const fields = gatherFormData();

      const payload = {
        status: statusMode,
        setId: currentSetId,
        runs: [fields]
      };

      fetch(GOOGLE_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.text())
      .then(resText => {
        if (resText.includes("Success")) {
          alert(statusMode === 'Draft' ? "💾 성공적으로 임시저장 되었습니다." : "🎉 측정 데이터 제출 완료!");
          if (statusMode === 'Completed') {
            resetForm();
          }
          loadDraftList();
        } else {
          alert("🛑 저장 실패: " + resText);
        }
      })
      .catch(err => {
        console.error(err);
        alert("🛑 네트워크 오류 발생");
      });
    }
