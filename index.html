<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생두 측정 결과 입력기</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar & dropdown styles */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .search-select-dropdown {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-20">

  <!-- 상단 내비게이션 바 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">☕</span>
        <h1 class="font-bold text-lg text-slate-800">생두 측정 결과 입력기</h1>
      </div>
      <div class="flex space-x-2">
        <button type="button" onclick="openExistingBeansModal()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 transition-all">
          📋 기존 정보 불러오기
        </button>
        <button type="button" onclick="openDraftsModal()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200 transition-all">
          📂 임시저장 목록
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-4xl mx-auto px-4 py-6">
    <form id="qcForm" onsubmit="event.preventDefault(); submitForm(false);">

      <!-- hidden ID 필드 -->
      <input type="hidden" id="beanId" name="beanId" value="">
      <input type="hidden" id="setId" name="setId" value="">
      <input type="hidden" id="currentRowId" name="currentRowId" value="">

      <!-- [그룹 1] 기본 정보 -->
      <section class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-4 overflow-visible">
        <h2 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3 flex items-center justify-between">
          <span>1. 기본 정보</span>
          <span class="text-xs font-normal text-slate-500">* 필수 항목</span>
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <!-- 커피 이름 -->
          <div class="col-span-1 md:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">커피 이름 *</label>
            <input type="text" id="coffeeName" required class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="예: Ethiopia Yirgacheffe G1 Washed">
          </div>
          
          <!-- 수확연도 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">수확연도</label>
            <input type="text" id="cropYear" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="예: 2025/2026">
          </div>

          <!-- 공급사 (검색 드롭다운) -->
          <div class="relative z-30 overflow-visible">
            <label class="block text-xs font-bold text-slate-700 mb-1">공급사</label>
            <input type="text" id="supplier_search" onfocus="toggleSearchSelect('supplier_dropdown', true)" onkeyup="filterSearchSelect('supplier_dropdown', this.value)" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white" placeholder="공급사 검색/선택">
            <input type="hidden" id="supplier" name="supplier">
            <div id="supplier_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-50 p-1 text-xs space-y-1 max-h-56 overflow-y-auto"></div>
          </div>

          <!-- 측정일자 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">측정일자</label>
            <input type="date" id="measureDate" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <!-- 측정목적 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">측정목적</label>
            <select id="measurePurpose" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
              <option value="입고 검사">입고 검사</option>
              <option value="정기 점검">정기 점검</option>
              <option value="샘플 테스트">샘플 테스트</option>
              <option value="기타">기타</option>
            </select>
          </div>
        </div>
      </section>


      <!-- [그룹 2] 생산 정보 -->
      <section class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-4 overflow-visible">
        <h2 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3">2. 생산 정보</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <!-- 국가 -->
          <div class="relative z-30 overflow-visible">
            <label class="block text-xs font-bold text-slate-700 mb-1">국가</label>
            <input type="text" id="country_search" onfocus="toggleSearchSelect('country_dropdown', true)" onkeyup="filterSearchSelect('country_dropdown', this.value)" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white" placeholder="국가 검색/선택">
            <input type="hidden" id="country" name="country">
            <div id="country_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-50 p-1 text-xs space-y-1 max-h-56 overflow-y-auto"></div>
          </div>

          <!-- 농장 -->
          <div class="relative z-30 overflow-visible">
            <label class="block text-xs font-bold text-slate-700 mb-1">농장</label>
            <input type="text" id="farm_search" onfocus="toggleSearchSelect('farm_dropdown', true)" onkeyup="filterSearchSelect('farm_dropdown', this.value)" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white" placeholder="농장 검색/선택">
            <input type="hidden" id="farm" name="farm">
            <div id="farm_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-50 p-1 text-xs space-y-1 max-h-56 overflow-y-auto"></div>
          </div>

          <!-- 생산자 -->
          <div class="relative z-30 overflow-visible">
            <label class="block text-xs font-bold text-slate-700 mb-1">생산자</label>
            <input type="text" id="producer_search" onfocus="toggleSearchSelect('producer_dropdown', true)" onkeyup="filterSearchSelect('producer_dropdown', this.value)" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white" placeholder="생산자 검색/선택">
            <input type="hidden" id="producer" name="producer">
            <div id="producer_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-50 p-1 text-xs space-y-1 max-h-56 overflow-y-auto"></div>
          </div>

          <!-- 상위 지역 (국가 연동) -->
          <div class="relative z-20 overflow-visible">
            <label class="block text-xs font-bold text-slate-700 mb-1">상위 지역</label>
            <input type="text" id="regionUpper_search" onfocus="toggleSearchSelect('regionUpper_dropdown', true)" onkeyup="filterSearchSelect('regionUpper_dropdown', this.value)" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white" placeholder="상위 지역 검색/선택">
            <input type="hidden" id="regionUpper" name="regionUpper">
            <div id="regionUpper_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-50 p-1 text-xs space-y-1 max-h-56 overflow-y-auto"></div>
          </div>

          <!-- 하위 지역 (국가/상위지역 연동) -->
          <div class="relative z-20 overflow-visible">
            <label class="block text-xs font-bold text-slate-700 mb-1">하위 지역</label>
            <input type="text" id="regionLower_search" onfocus="toggleSearchSelect('regionLower_dropdown', true)" onkeyup="filterSearchSelect('regionLower_dropdown', this.value)" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white" placeholder="하위 지역 검색/선택">
            <input type="hidden" id="regionLower" name="regionLower">
            <div id="regionLower_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-50 p-1 text-xs space-y-1 max-h-56 overflow-y-auto"></div>
          </div>

          <!-- 고도 범위 -->
          <div class="flex items-center space-x-1">
            <div class="w-1/2">
              <label class="block text-[11px] font-bold text-slate-700 mb-1">고도 최저(m)</label>
              <input type="number" id="altitudeMin" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="1500">
            </div>
            <span class="pt-5 text-slate-400">~</span>
            <div class="w-1/2">
              <label class="block text-[11px] font-bold text-slate-700 mb-1">고도 최고(m)</label>
              <input type="number" id="altitudeMax" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="1800">
            </div>
          </div>
        </div>
      </section>


      <!-- [그룹 3] 품종 정보 -->
      <section class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-4 overflow-visible">
        <div class="flex items-center justify-between border-b pb-2 mb-3">
          <h2 class="text-sm font-bold text-slate-800">3. 품종 정보</h2>
          <button type="button" onclick="openAddVarietyModal()" class="text-xs text-emerald-600 font-semibold hover:underline">
            + 신규 품종 DB 등록
          </button>
        </div>

        <!-- 선택된 품종 태그 출력 영역 -->
        <div class="mb-3">
          <label class="block text-xs font-bold text-slate-700 mb-1">선택된 품종 목록</label>
          <div id="selectedVarietyTags" class="p-2 border rounded-lg bg-slate-50 min-h-[36px] flex flex-wrap gap-1 items-center">
            <span class="text-xs text-slate-400">품종을 선택해 주세요.</span>
          </div>
          <input type="hidden" id="variety" name="variety">
        </div>

        <!-- 품종 알파벳/숫자 접이식 아코디언 목록 -->
        <div id="varietyAccordionContainer" class="space-y-1.5 max-h-96 overflow-y-auto pr-1"></div>
      </section>


      <!-- [그룹 4] 프로세싱 정보 -->
      <section class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-4 overflow-visible">
        <div class="flex items-center justify-between border-b pb-2 mb-3">
          <h2 class="text-sm font-bold text-slate-800">4. 프로세싱 정보</h2>
          <button type="button" onclick="openProcessSetModal()" class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 border border-indigo-200 transition-all">
            ⚙ 프로세싱 세트 (프리셋) 팝업
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
          <!-- 대분류 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">프로세싱 대분류</label>
            <select id="processMain" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
              <option value="Washed">Washed</option>
              <option value="Natural">Natural</option>
              <option value="Honey/PN">Honey/PN</option>
              <option value="Semi Washed/White Honey">Semi Washed/White Honey</option>
            </select>
          </div>

          <!-- 발효 타입 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">발효 타입</label>
            <div class="flex space-x-4 pt-1.5 text-xs">
              <label class="flex items-center cursor-pointer">
                <input type="radio" name="processFermentation" value="Aerobic" checked class="text-emerald-600 focus:ring-emerald-500">
                <span class="ml-1 text-slate-700">Aerobic (호기성)</span>
              </label>
              <label class="flex items-center cursor-pointer">
                <input type="radio" name="processFermentation" value="Anaerobic" class="text-emerald-600 focus:ring-emerald-500">
                <span class="ml-1 text-slate-700">Anaerobic (혐기성)</span>
              </label>
              <label class="flex items-center cursor-pointer">
                <input type="radio" name="processFermentation" value="Complex" class="text-emerald-600 focus:ring-emerald-500">
                <span class="ml-1 text-slate-700">Complex</span>
              </label>
            </div>
          </div>
        </div>

        <!-- 소분류 (알파벳 오름차순 A-Z 정렬 칩) -->
        <div class="mb-3">
          <label class="block text-xs font-bold text-slate-700 mb-1">프로세싱 소분류 (알파벳 오름차순)</label>
          <div id="subChipContainer" class="p-2 border rounded-lg bg-slate-50 flex flex-wrap gap-1 max-h-40 overflow-y-auto"></div>
          <input type="hidden" id="processSub" name="processSub">
        </div>

        <!-- 프로세싱 비고 -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">프로세싱 비고</label>
          <input type="text" id="processNotes" class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="발효 시간, 특이사항 등">
        </div>
      </section>


      <!-- [그룹 9] 감각검사 (부피 / 경도) -->
      <section class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-4 overflow-visible">
        <h2 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3">5. 감각 평가 (부피 & 경도)</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 감각 부피 -->
          <div class="p-3 bg-slate-50 border rounded-lg flex items-center justify-between">
            <div>
              <span class="block text-xs font-bold text-slate-700">#감각 부피</span>
              <span class="text-[10px] text-slate-400">1(매우 작음) ~ 5(매우큼)</span>
            </div>
            <div class="flex items-center space-x-2">
              <button type="button" onclick="stepSensory('sensoryVolume', -1)" class="w-7 h-7 bg-white border rounded font-bold text-slate-600 hover:bg-slate-100">-</button>
              <input type="number" id="sensoryVolume" value="3" min="1" max="5" class="w-10 text-center text-xs font-bold p-1 border rounded bg-white">
              <button type="button" onclick="stepSensory('sensoryVolume', 1)" class="w-7 h-7 bg-white border rounded font-bold text-slate-600 hover:bg-slate-100">+</button>
            </div>
          </div>

          <!-- 감각 경도 -->
          <div class="p-3 bg-slate-50 border rounded-lg flex items-center justify-between">
            <div>
              <span class="block text-xs font-bold text-slate-700">#감각 경도</span>
              <span class="text-[10px] text-slate-400">1(매우 무름) ~ 5(매우 단단함)</span>
            </div>
            <div class="flex items-center space-x-2">
              <button type="button" onclick="stepSensory('sensoryHardness', -1)" class="w-7 h-7 bg-white border rounded font-bold text-slate-600 hover:bg-slate-100">-</button>
              <input type="number" id="sensoryHardness" value="3" min="1" max="5" class="w-10 text-center text-xs font-bold p-1 border rounded bg-white">
              <button type="button" onclick="stepSensory('sensoryHardness', 1)" class="w-7 h-7 bg-white border rounded font-bold text-slate-600 hover:bg-slate-100">+</button>
            </div>
          </div>
        </div>
      </section>


      <!-- 하단 버튼 영역 -->
      <div class="flex space-x-3 pt-2">
        <button type="button" onclick="submitForm(true)" class="w-1/2 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm rounded-xl shadow-sm transition-all">
          💾 임시 저장
        </button>
        <button type="button" onclick="submitForm(false)" class="w-1/2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-sm transition-all">
          🚀 전체 회차 제출
        </button>
      </div>

    </form>
  </main>


  <!-- 모달 1: 신규 품종 등록 모달 -->
  <div id="addVarietyModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-5 shadow-2xl">
      <h3 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3">신규 품종 DB 등록</h3>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">품종명 *</label>
          <input type="text" id="newVarName" class="w-full p-2 border rounded-lg" placeholder="예: Dega">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">종 *</label>
          <select id="newVarSpecies" onchange="onNewVarSpeciesChange()" class="w-full p-2 border rounded-lg bg-white">
            <option value="Arabica">Arabica</option>
            <option value="Robusta">Robusta</option>
            <option value="Eugenioides">Eugenioides</option>
            <option value="Liberica">Liberica</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">품종 그룹</label>
          <select id="newVarGroup" class="w-full p-2 border rounded-lg bg-white"></select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">대표 명칭 (이명 통합용)</label>
          <input type="text" id="newVarRepName" class="w-full p-2 border rounded-lg" placeholder="기본/대표 품종명">
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-4 pt-2 border-t">
        <button type="button" onclick="closeAddVarietyModal()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">취소</button>
        <button type="button" onclick="saveNewVarietyToDB()" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold">저장</button>
      </div>
    </div>
  </div>


  <!-- 모달 2: 프로세싱 세트 (프리셋) 모달 -->
  <div id="processSetModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-lg w-full p-5 shadow-2xl">
      <h3 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3 flex justify-between items-center">
        <span>⚙ 프로세싱 세트 선택</span>
        <button type="button" onclick="closeProcessSetModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </h3>
      <input type="text" id="processSetSearch" onkeyup="filterProcessSetModalList()" class="w-full text-xs p-2 border rounded-lg mb-3" placeholder="세트명 또는 비고 검색...">
      <div id="processSetModalList" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
    </div>
  </div>


  <!-- 모달 3: 기존 정보 불러오기 모달 -->
  <div id="existingBeansModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full p-5 shadow-2xl">
      <h3 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3 flex justify-between items-center">
        <span>📋 기존 생두/농장/지역 정보 불러오기</span>
        <button type="button" onclick="closeExistingBeansModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </h3>
      
      <!-- 탭 선택 -->
      <div class="flex border-b mb-3 text-xs font-bold">
        <button type="button" onclick="switchExistingTab('all')" id="tab_all" class="px-3 py-2 border-b-2 border-emerald-600 text-emerald-600">전체 데이터</button>
        <button type="button" onclick="switchExistingTab('farm')" id="tab_farm" class="px-3 py-2 border-b-2 border-transparent text-slate-500">DB_농장</button>
        <button type="button" onclick="switchExistingTab('region')" id="tab_region" class="px-3 py-2 border-b-2 border-transparent text-slate-500">DB_지역</button>
      </div>

      <input type="text" id="existingSearch" onkeyup="filterExistingModalList()" class="w-full text-xs p-2 border rounded-lg mb-3" placeholder="커피 이름, 농장, 국가, 품종 검색...">
      <div id="existingBeansList" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
    </div>
  </div>


  <!-- 모달 4: 임시저장 목록 모달 -->
  <div id="draftsModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-xl w-full p-5 shadow-2xl">
      <h3 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3 flex justify-between items-center">
        <span>📂 임시저장 목록</span>
        <button type="button" onclick="closeDraftsModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </h3>
      <div id="draftsModalList" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
    </div>
  </div>


  <!-- 스크립트 로직 -->
  <script>
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxcrdb0tqAnKzZQ3tq7vWIEMNePTHz82vFurIP6PMlZOiV7TEtGyHAUNZukEKbH1lE/exec"; // 배포 시 Apps Script URL 주입
    let dbCache = {};
    let selectedVarieties = [];
    let selectedSubProcess = [];
    let cachedProcessSets = [];
    let cachedExistingBeans = [];
    let currentExistingTab = 'all';

    // 초기화
    window.onload = function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('measureDate').value = today;
      
      initVarietyAccordion();
      initSubProcessingChips();
      loadDBLists();
    };

    // 1. DB 목록 가져오기 & 검색 드롭다운 초기화
    function loadDBLists() {
      fetch(`${GOOGLE_WEB_APP_URL}?action=getDB`)
        .then(res => res.json())
        .then(data => {
          dbCache = data || {};
          populateSearchSelectData('supplier_dropdown', data.supplier, 0, 'supplier');
          populateSearchSelectData('country_dropdown', data.country, 0, 'country', onCountryChange);
          populateSearchSelectData('farm_dropdown', data.farm, 1, 'farm', onFarmChange);
          populateSearchSelectData('producer_dropdown', data.producer, 0, 'producer');
          populateSearchSelectData('regionUpper_dropdown', data.region, 1, 'regionUpper', onRegionUpperChange);
          populateSearchSelectData('regionLower_dropdown', data.region, 2, 'regionLower');

          renderSubProcessingChipsFromDB(data.processing);
          onNewVarSpeciesChange();
        }).catch(err => console.error(err));
    }

    // 검색 결합형 드롭다운 컴포넌트
    function populateSearchSelectData(dropdownId, arr, colIdx, hiddenId, onSelectCallback = null) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      dropdown.innerHTML = '';
      if (!arr || !Array.isArray(arr)) return;

      const set = new Set();
      for (let i = 1; i < arr.length; i++) {
        const val = String(arr[i][colIdx] || '').trim();
        if (val && !set.has(val)) {
          set.add(val);
          const item = document.createElement('div');
          item.className = 'p-2 hover:bg-emerald-50 cursor-pointer rounded font-medium text-slate-700 transition-colors';
          item.textContent = val;
          item.onclick = function() {
            document.getElementById(hiddenId + '_search').value = val;
            document.getElementById(hiddenId).value = val;
            toggleSearchSelect(dropdownId, false);
            if (onSelectCallback) onSelectCallback(val);
          };
          dropdown.appendChild(item);
        }
      }
    }

    function toggleSearchSelect(dropdownId, show) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      if (show) dropdown.classList.remove('hidden');
      else dropdown.classList.add('hidden');
    }

    function filterSearchSelect(dropdownId, q) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      toggleSearchSelect(dropdownId, true);
      const query = q.toLowerCase();
      const items = dropdown.children;
      for (let item of items) {
        if (item.textContent.toLowerCase().includes(query)) item.classList.remove('hidden');
        else item.classList.add('hidden');
      }
    }

    // 2. 국가 -> 상위 지역 -> 하위 지역 연동 필터링
    function onCountryChange(cVal) {
      // 농장 필터링
      populateFilteredFarmSelect(cVal);

      // 상위 지역 필터링 (선택된 국가에 매핑된 상위 지역만)
      const upperDropdown = document.getElementById('regionUpper_dropdown');
      upperDropdown.innerHTML = '';
      if (dbCache.region) {
        const set = new Set();
        for (let i = 1; i < dbCache.region.length; i++) {
          const country = String(dbCache.region[i][0] || '').trim().toLowerCase();
          const upper = String(dbCache.region[i][1] || '').trim();
          if (country === cVal.toLowerCase() && upper && !set.has(upper)) {
            set.add(upper);
            const item = document.createElement('div');
            item.className = 'p-2 hover:bg-emerald-50 cursor-pointer rounded font-medium text-slate-700';
            item.textContent = upper;
            item.onclick = function() {
              document.getElementById('regionUpper_search').value = upper;
              document.getElementById('regionUpper').value = upper;
              toggleSearchSelect('regionUpper_dropdown', false);
              onRegionUpperChange(upper);
            };
            upperDropdown.appendChild(item);
          }
        }
      }

      // 하위 지역 초기화
      document.getElementById('regionUpper_search').value = '';
      document.getElementById('regionUpper').value = '';
      document.getElementById('regionLower_search').value = '';
      document.getElementById('regionLower').value = '';
      document.getElementById('regionLower_dropdown').innerHTML = '';
    }

    function onRegionUpperChange(uVal) {
      const cVal = document.getElementById('country').value || '';
      const lowerDropdown = document.getElementById('regionLower_dropdown');
      lowerDropdown.innerHTML = '';
      if (!dbCache.region) return;

      const set = new Set();
      for (let i = 1; i < dbCache.region.length; i++) {
        const country = String(dbCache.region[i][0] || '').trim().toLowerCase();
        const upper = String(dbCache.region[i][1] || '').trim().toLowerCase();
        const lower = String(dbCache.region[i][2] || '').trim();

        if ((!cVal || country === cVal.toLowerCase()) && upper === uVal.toLowerCase() && lower && !set.has(lower)) {
          set.add(lower);
          const item = document.createElement('div');
          item.className = 'p-2 hover:bg-emerald-50 cursor-pointer rounded font-medium text-slate-700';
          item.textContent = lower;
          item.onclick = function() {
            document.getElementById('regionLower_search').value = lower;
            document.getElementById('regionLower').value = lower;
            toggleSearchSelect('regionLower_dropdown', false);
          };
          lowerDropdown.appendChild(item);
        }
      }
    }

    function populateFilteredFarmSelect(cVal) {
      const dropdown = document.getElementById('farm_dropdown');
      dropdown.innerHTML = '';
      if (!dbCache.farm) return;

      for (let i = 1; i < dbCache.farm.length; i++) {
        const country = String(dbCache.farm[i][0] || '').trim().toLowerCase();
        const farmName = String(dbCache.farm[i][1] || '').trim();
        const producer = String(dbCache.farm[i][3] || '').trim();

        if (country === cVal.toLowerCase() && farmName) {
          const item = document.createElement('div');
          item.className = 'p-2 hover:bg-emerald-50 cursor-pointer rounded font-medium text-slate-700 flex justify-between';
          item.innerHTML = `<span>${farmName}</span> <span class="text-[10px] text-slate-400">${producer}</span>`;
          item.onclick = function() {
            document.getElementById('farm_search').value = farmName;
            document.getElementById('farm').value = farmName;
            toggleSearchSelect('farm_dropdown', false);
            onFarmChange(farmName);
          };
          dropdown.appendChild(item);
        }
      }
    }

    function onFarmChange(farmName) {
      if (!dbCache.farm) return;
      for (let i = 1; i < dbCache.farm.length; i++) {
        if (String(dbCache.farm[i][1] || '').trim() === farmName) {
          const producer = String(dbCache.farm[i][3] || '').trim();
          const upper = String(dbCache.farm[i][4] || '').trim();
          const lower = String(dbCache.farm[i][5] || '').trim();

          if (producer) {
            document.getElementById('producer_search').value = producer;
            document.getElementById('producer').value = producer;
          }
          if (upper) {
            document.getElementById('regionUpper_search').value = upper;
            document.getElementById('regionUpper').value = upper;
          }
          if (lower) {
            document.getElementById('regionLower_search').value = lower;
            document.getElementById('regionLower').value = lower;
          }
          break;
        }
      }
    }


    // 3. 품종 알파벳/숫자 개별 묶음 + 접이식 (<details>)
    const defaultVarieties = [
      "Typica", "Bourbon", "Caturra", "Castillo", "Colombia", "Catuai", "Geisha", "Maragogype", 
      "Pacamara", "Pacas", "SL28", "SL34", "Ruiru 11", "Batian", "K7", "Kent", "Arusha", 
      "Jackson", "Popayan", "Mundo Novo", "Topazio", "Icatu", "Obata", "Tupi", "Rubi", "Catucai", 
      "Bourbon Sidra", "Pink Bourbon", "Red Bourbon", "Yellow Bourbon", "Java", "Anacafe 14", 
      "Marsellesa", "Parainema", "Centroamericano", "Starmaya", "Sarchimor", "Catimor", "Lempira", 
      "Villa Sarchi", "Verschillende", "74110", "74112", "74158", "74140", "74165", "Kurume", 
      "Dega", "Wolisho", "Kudhome", "Bedessa", "Deiga", "Rume Sudan", "Laurina", "Pointu Bourbon", 
      "Eugenioides", "Canephora", "SL14", "SL38"
    ];

    function initVarietyAccordion() {
      const container = document.getElementById('varietyAccordionContainer');
      container.innerHTML = '';

      // 그룹 나누기 (Arabica 0-9, Arabica A~Z, Robusta, Other)
      const groups = {};
      groups["Arabica 0-9"] = [];
      for (let i = 65; i <= 90; i++) {
        groups["Arabica " + String.fromCharCode(i)] = [];
      }
      groups["Robusta"] = [];
      groups["Other"] = [];

      defaultVarieties.forEach(v => {
        const firstChar = v.charAt(0).toUpperCase();
        if (/^[0-9]/.test(firstChar)) {
          groups["Arabica 0-9"].push(v);
        } else if (/^[A-Z]/.test(firstChar)) {
          groups["Arabica " + firstChar].push(v);
        } else {
          groups["Other"].push(v);
        }
      });

      // HTML Render
      Object.keys(groups).forEach(key => {
        const items = groups[key];
        if (items.length === 0) return;

        const details = document.createElement('details');
        details.className = 'border border-gray-200 rounded-lg mb-1.5 bg-white shadow-sm overflow-hidden group';
        
        details.innerHTML = `
          <summary class="font-bold text-xs text-slate-800 p-2 bg-slate-50 hover:bg-emerald-50 cursor-pointer flex justify-between items-center select-none transition-colors">
            <span>🏷 ${key}</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold">${items.length}개</span>
          </summary>
          <div class="p-2 flex flex-wrap gap-1 border-t bg-white"></div>
        `;

        const chipBox = details.querySelector('div');
        items.sort().forEach(vName => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'variety-chip px-2.5 py-1 border rounded-lg text-xs bg-slate-100 text-slate-700 font-medium hover:bg-emerald-50 transition-all';
          btn.textContent = vName;
          btn.onclick = function() { toggleVarietySelection(vName, btn); };
          chipBox.appendChild(btn);
        });

        container.appendChild(details);
      });
    }

    function toggleVarietySelection(vName, btnEl) {
      const idx = selectedVarieties.indexOf(vName);
      if (idx > -1) {
        selectedVarieties.splice(idx, 1);
        btnEl.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-600');
        btnEl.classList.add('bg-slate-100', 'text-slate-700');
      } else {
        selectedVarieties.push(vName);
        btnEl.classList.remove('bg-slate-100', 'text-slate-700');
        btnEl.classList.add('bg-emerald-600', 'text-white', 'border-emerald-600');
      }
      renderSelectedVarietyTags();
    }

    function renderSelectedVarietyTags() {
      const container = document.getElementById('selectedVarietyTags');
      const hiddenInput = document.getElementById('variety');
      container.innerHTML = '';

      if (selectedVarieties.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-400">품종을 선택해 주세요.</span>`;
        hiddenInput.value = '';
        return;
      }

      hiddenInput.value = selectedVarieties.join(', ');

      selectedVarieties.forEach(v => {
        const tag = document.createElement('span');
        tag.className = 'inline-flex items-center px-2 py-1 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200';
        tag.innerHTML = `${v} <button type="button" onclick="removeVariety('${v}')" class="ml-1.5 text-emerald-600 hover:text-emerald-900 font-bold">✕</button>`;
        container.appendChild(tag);
      });
    }

    function removeVariety(vName) {
      const idx = selectedVarieties.indexOf(vName);
      if (idx > -1) selectedVarieties.splice(idx, 1);
      
      // Chip UI 원복
      document.querySelectorAll('.variety-chip').forEach(btn => {
        if (btn.textContent === vName) {
          btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-600');
          btn.classList.add('bg-slate-100', 'text-slate-700');
        }
      });
      renderSelectedVarietyTags();
    }


    // 4. 프로세싱 소분류 (알파벳 오름차순 A-Z 정렬 칩)
    const defaultSubProcesses = [
      "Bioreactor", "Black Honey", "Carbonic Maceration", "CM", "Co-Fermentation", 
      "Decaf", "Hydro", "Infused", "Mosto", "Nitrogen", "Red Honey", 
      "Slow Dried", "Thermal Shock", "Zero"
    ];

    function initSubProcessingChips() {
      renderSubProcessingChips(defaultSubProcesses);
    }

    function renderSubProcessingChipsFromDB(dbArr) {
      const set = new Set(defaultSubProcesses);
      if (dbArr && Array.isArray(dbArr)) {
        for (let i = 1; i < dbArr.length; i++) {
          const sub = String(dbArr[i][1] || '').trim();
          if (sub && sub !== "Anaerobic" && sub !== "Aerobic" && sub !== "Complex") {
            set.add(sub);
          }
        }
      }
      const sortedList = Array.from(set).sort((a, b) => a.localeCompare(b));
      renderSubProcessingChips(sortedList);
    }

    function renderSubProcessingChips(list) {
      const container = document.getElementById('subChipContainer');
      container.innerHTML = '';

      list.forEach(sub => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sub-chip px-2.5 py-1 border rounded-lg text-xs bg-slate-100 text-slate-700 font-medium hover:bg-emerald-50 transition-all';
        btn.textContent = sub;
        btn.onclick = function() { toggleSubProcessSelection(sub, btn); };
        container.appendChild(btn);
      });
    }

    function toggleSubProcessSelection(subName, btnEl) {
      const idx = selectedSubProcess.indexOf(subName);
      if (idx > -1) {
        selectedSubProcess.splice(idx, 1);
        btnEl.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
        btnEl.classList.add('bg-slate-100', 'text-slate-700');
      } else {
        selectedSubProcess.push(subName);
        btnEl.classList.remove('bg-slate-100', 'text-slate-700');
        btnEl.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
      }
      document.getElementById('processSub').value = selectedSubProcess.join(', ');
    }


    // 5. 감각 스텝 버튼
    function stepSensory(id, step) {
      const el = document.getElementById(id);
      let val = parseInt(el.value || 3, 10) + step;
      if (val < 1) val = 1;
      if (val > 5) val = 5;
      el.value = val;
    }


    // 6. 프로세싱 세트 (프리셋) 팝업
    function openProcessSetModal() {
      document.getElementById('processSetModal').classList.remove('hidden');
      if (cachedProcessSets.length === 0) {
        fetch(`${GOOGLE_WEB_APP_URL}?action=getProcessSets`)
          .then(res => res.json())
          .then(data => {
            cachedProcessSets = data || [];
            filterProcessSetModalList();
          });
      } else {
        filterProcessSetModalList();
      }
    }

    function closeProcessSetModal() {
      document.getElementById('processSetModal').classList.add('hidden');
    }

    function filterProcessSetModalList() {
      const q = document.getElementById('processSetSearch').value.trim().toLowerCase();
      const filtered = cachedProcessSets.filter(s => {
        return (s.setName || '').toLowerCase().includes(q) || (s.notes || '').toLowerCase().includes(q);
      });
      renderProcessSetModalList(filtered);
    }

    function renderProcessSetModalList(list) {
      const container = document.getElementById('processSetModalList');
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-slate-400">등록된 프로세싱 세트가 없습니다.</div>`;
        return;
      }

      list.forEach(s => {
        const item = document.createElement('div');
        item.className = 'p-3 border rounded-xl hover:bg-emerald-50 cursor-pointer transition-all bg-white';
        item.innerHTML = `
          <div class="font-bold text-xs text-slate-800">${s.setName}</div>
          <div class="text-[11px] text-slate-500 mt-1">대분류: ${s.mainCategory || '-'} | 소분류: ${s.subCategory || '-'} | 발효: ${s.fermentation || '-'}</div>
          ${s.notes ? `<div class="text-[10px] text-slate-400 mt-0.5">${s.notes}</div>` : ''}
        `;
        item.onclick = function() { selectProcessSetFromModal(s); };
        container.appendChild(item);
      });
    }

    function selectProcessSetFromModal(s) {
      if (s.mainCategory) document.getElementById('processMain').value = s.mainCategory;
      if (s.notes) document.getElementById('processNotes').value = s.notes;

      // 발효 타입 선택
      if (s.fermentation) {
        const radios = document.getElementsByName('processFermentation');
        radios.forEach(r => {
          if (r.value.toLowerCase() === s.fermentation.toLowerCase()) r.checked = true;
        });
      }

      // 소분류 선택
      if (s.subCategory) {
        selectedSubProcess = [s.subCategory];
        document.getElementById('processSub').value = s.subCategory;

        document.querySelectorAll('.sub-chip').forEach(btn => {
          if (btn.textContent === s.subCategory) {
            btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
          } else {
            btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
            btn.classList.add('bg-slate-100', 'text-slate-700');
          }
        });
      }

      closeProcessSetModal();
    }


    // 7. 기존 생두 정보 불러오기 모달
    function openExistingBeansModal() {
      document.getElementById('existingBeansModal').classList.remove('hidden');
      if (cachedExistingBeans.length === 0) {
        fetch(`${GOOGLE_WEB_APP_URL}?action=getExistingBeans`)
          .then(res => res.json())
          .then(data => {
            cachedExistingBeans = data || [];
            filterExistingModalList();
          });
      } else {
        filterExistingModalList();
      }
    }

    function closeExistingBeansModal() {
      document.getElementById('existingBeansModal').classList.add('hidden');
    }

    function switchExistingTab(tab) {
      currentExistingTab = tab;
      ['all', 'farm', 'region'].forEach(t => {
        const btn = document.getElementById('tab_' + t);
        if (t === tab) {
          btn.className = "px-3 py-2 border-b-2 border-emerald-600 text-emerald-600";
        } else {
          btn.className = "px-3 py-2 border-b-2 border-transparent text-slate-500";
        }
      });
      filterExistingModalList();
    }

    function filterExistingModalList() {
      const q = document.getElementById('existingSearch').value.trim().toLowerCase();
      const container = document.getElementById('existingBeansList');
      container.innerHTML = '';

      if (currentExistingTab === 'all') {
        const filtered = cachedExistingBeans.filter(b => {
          return (b["커피 이름"] || '').toLowerCase().includes(q) ||
                 (b["농장"] || '').toLowerCase().includes(q) ||
                 (b["국가"] || '').toLowerCase().includes(q) ||
                 (b["품종"] || '').toLowerCase().includes(q);
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="text-center py-4 text-slate-400">불러올 기존 생두 정보가 없습니다.</div>`;
          return;
        }

        filtered.forEach(b => {
          const item = document.createElement('div');
          item.className = 'p-3 border rounded-xl hover:bg-emerald-50 cursor-pointer transition-all bg-white';
          item.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="font-bold text-xs text-slate-800">${b["커피 이름"]}</span>
              <span class="text-[10px] text-slate-400">${b["수확연도"] || ''}</span>
            </div>
            <div class="text-[11px] text-slate-500 mt-1">국가: ${b["국가"] || '-'} | 농장: ${b["농장"] || '-'} | 품종: ${b["품종_표시"] || b["품종"] || '-'}</div>
          `;
          item.onclick = function() { loadExistingBeanDataIntoForm(b); };
          container.appendChild(item);
        });
      } else if (currentExistingTab === 'farm') {
        const list = dbCache.farm || [];
        for (let i = 1; i < list.length; i++) {
          const farmName = list[i][1];
          const country = list[i][0];
          if (farmName && (farmName.toLowerCase().includes(q) || country.toLowerCase().includes(q))) {
            const item = document.createElement('div');
            item.className = 'p-2.5 border rounded-lg hover:bg-emerald-50 cursor-pointer text-xs font-medium text-slate-700 bg-white';
            item.textContent = `[${country}] ${farmName}`;
            item.onclick = function() {
              document.getElementById('farm_search').value = farmName;
              document.getElementById('farm').value = farmName;
              if (country) {
                document.getElementById('country_search').value = country;
                document.getElementById('country').value = country;
              }
              closeExistingBeansModal();
            };
            container.appendChild(item);
          }
        }
      } else if (currentExistingTab === 'region') {
        const list = dbCache.region || [];
        for (let i = 1; i < list.length; i++) {
          const upper = list[i][1];
          const country = list[i][0];
          if (upper && (upper.toLowerCase().includes(q) || country.toLowerCase().includes(q))) {
            const item = document.createElement('div');
            item.className = 'p-2.5 border rounded-lg hover:bg-emerald-50 cursor-pointer text-xs font-medium text-slate-700 bg-white';
            item.textContent = `[${country}] ${upper}`;
            item.onclick = function() {
              document.getElementById('regionUpper_search').value = upper;
              document.getElementById('regionUpper').value = upper;
              if (country) {
                document.getElementById('country_search').value = country;
                document.getElementById('country').value = country;
              }
              closeExistingBeansModal();
            };
            container.appendChild(item);
          }
        }
      }
    }

    function loadExistingBeanDataIntoForm(b) {
      document.getElementById('coffeeName').value = b["커피 이름"] || '';
      document.getElementById('cropYear').value = b["수확연도"] || '';

      if (b["공급사"]) {
        document.getElementById('supplier_search').value = b["공급사"];
        document.getElementById('supplier').value = b["공급사"];
      }
      if (b["국가"]) {
        document.getElementById('country_search').value = b["국가"];
        document.getElementById('country').value = b["국가"];
      }
      if (b["농장"]) {
        document.getElementById('farm_search').value = b["농장"];
        document.getElementById('farm').value = b["농장"];
      }
      if (b["생산자"]) {
        document.getElementById('producer_search').value = b["생산자"];
        document.getElementById('producer').value = b["생산자"];
      }
      if (b["상위 지역"]) {
        document.getElementById('regionUpper_search').value = b["상위 지역"];
        document.getElementById('regionUpper').value = b["상위 지역"];
      }
      if (b["하위 지역"]) {
        document.getElementById('regionLower_search').value = b["하위 지역"];
        document.getElementById('regionLower').value = b["하위 지역"];
      }
      if (b["재배고도 범위 최저"]) document.getElementById('altitudeMin').value = b["재배고도 범위 최저"];
      if (b["재배고도 범위 최고"]) document.getElementById('altitudeMax').value = b["재배고도 범위 최고"];

      // 품종 세팅
      if (b["품종"]) {
        selectedVarieties = b["품종"].split(',').map(s => s.trim()).filter(Boolean);
        renderSelectedVarietyTags();
      }

      // 프로세싱 세팅
      if (b["프로세싱 대분류"]) document.getElementById('processMain').value = b["프로세싱 대분류"];
      if (b["프로세싱 비고"]) document.getElementById('processNotes').value = b["프로세싱 비고"];
      if (b["프로세싱 소분류"]) {
        selectedSubProcess = b["프로세싱 소분류"].split(',').map(s => s.trim()).filter(Boolean);
        document.getElementById('processSub').value = b["프로세싱 소분류"];
      }

      // **중요**: 기존 생두 정보 불러오기는 '양식 복사'이므로 currentRowId 및 setId를 강제 초기화하여 신규 저장 사건으로 유도
      document.getElementById('currentRowId').value = '';
      document.getElementById('setId').value = '';
      document.getElementById('beanId').value = b["생두 고유 ID"] || '';

      closeExistingBeansModal();
      alert("기존 생두 정보가 성공적으로 불러와졌습니다.
(저장 시 신규 측정 세트 ID가 부여됩니다.)");
    }


    // 8. 신규 품종 DB 등록
    function openAddVarietyModal() {
      document.getElementById('addVarietyModal').classList.remove('hidden');
    }

    function closeAddVarietyModal() {
      document.getElementById('addVarietyModal').classList.add('hidden');
    }

    function onNewVarSpeciesChange() {
      const species = document.getElementById('newVarSpecies').value;
      const groupSelect = document.getElementById('newVarGroup');
      groupSelect.innerHTML = '';

      let options = [];
      if (species === 'Arabica') {
        options = ["Ethiopia", "Typica/Bourbon", "Hybrid", "Other"];
      } else {
        options = ["Robusta", "Other"];
      }

      options.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        groupSelect.appendChild(o);
      });
    }

    function saveNewVarietyToDB() {
      const name = document.getElementById('newVarName').value.trim();
      const species = document.getElementById('newVarSpecies').value;
      const group = document.getElementById('newVarGroup').value;
      const repName = document.getElementById('newVarRepName').value.trim();

      if (!name) { alert("품종명을 입력해 주세요."); return; }

      fetch(GOOGLE_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: "addVariety",
          varietyName: name,
          species: species,
          varietyGroup: group,
          representativeName: repName
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert(data.message);
          closeAddVarietyModal();
          // 내 품종 칩에 추가
          if (!selectedVarieties.includes(name)) {
            selectedVarieties.push(name);
            renderSelectedVarietyTags();
          }
        }
      });
    }


    // 9. 임시저장 목록 모달
    function openDraftsModal() {
      document.getElementById('draftsModal').classList.remove('hidden');
      fetch(`${GOOGLE_WEB_APP_URL}?action=getDrafts`)
        .then(res => res.json())
        .then(data => {
          renderDraftsModalList(data.drafts || []);
        });
    }

    function closeDraftsModal() {
      document.getElementById('draftsModal').classList.add('hidden');
    }

    function renderDraftsModalList(drafts) {
      const container = document.getElementById('draftsModalList');
      container.innerHTML = '';
      if (!drafts || drafts.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-slate-400">저장된 임시저장 내역이 없습니다.</div>`;
        return;
      }

      drafts.forEach(d => {
        const f = d.fields || {};
        const item = document.createElement('div');
        item.className = 'p-3 border rounded-xl hover:bg-amber-50 cursor-pointer transition-all bg-white';
        item.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-xs text-slate-800">${f["커피 이름"] || '이름 없음'}</span>
            <span class="text-[10px] text-slate-400">${f["측정일자"] || ''}</span>
          </div>
          <div class="text-[11px] text-slate-500 mt-1">공급사: ${f["공급사"] || '-'} | 국가: ${f["국가"] || '-'}</div>
        `;
        item.onclick = function() { loadDraftIntoForm(d); };
        container.appendChild(item);
      });
    }

    function loadDraftIntoForm(d) {
      const f = d.fields || {};
      document.getElementById('coffeeName').value = f["커피 이름"] || '';
      document.getElementById('cropYear').value = f["수확연도"] || '';
      document.getElementById('supplier_search').value = f["공급사"] || '';
      document.getElementById('supplier').value = f["공급사"] || '';
      document.getElementById('country_search').value = f["국가"] || '';
      document.getElementById('country').value = f["국가"] || '';
      document.getElementById('farm_search').value = f["농장"] || '';
      document.getElementById('farm').value = f["농장"] || '';
      document.getElementById('producer_search').value = f["생산자"] || '';
      document.getElementById('producer').value = f["생산자"] || '';
      document.getElementById('regionUpper_search').value = f["상위 지역"] || '';
      document.getElementById('regionUpper').value = f["상위 지역"] || '';
      document.getElementById('regionLower_search').value = f["하위 지역"] || '';
      document.getElementById('regionLower').value = f["하위 지역"] || '';
      document.getElementById('altitudeMin').value = f["재배고도 범위 최저"] || '';
      document.getElementById('altitudeMax').value = f["재배고도 범위 최고"] || '';

      if (f["품종"]) {
        selectedVarieties = f["품종"].split(',').map(s => s.trim()).filter(Boolean);
        renderSelectedVarietyTags();
      }

      if (f["프로세싱 대분류"]) document.getElementById('processMain').value = f["프로세싱 대분류"];
      if (f["프로세싱 비고"]) document.getElementById('processNotes').value = f["프로세싱 비고"];
      if (f["프로세싱 소분류"]) {
        selectedSubProcess = f["프로세싱 소분류"].split(',').map(s => s.trim()).filter(Boolean);
        document.getElementById('processSub').value = f["프로세싱 소분류"];
      }

      document.getElementById('setId').value = f["측정 세트 ID"] || '';
      document.getElementById('beanId').value = f["생두 고유 ID"] || '';
      document.getElementById('currentRowId').value = f["Row_ID"] || '';

      closeDraftsModal();
      alert("임시저장 데이터 불러오기가 완료되었습니다.");
    }


    // 10. 폼 제출 (3단계 ID 계산 및 저장)
    function submitForm(isDraft) {
      const coffeeName = document.getElementById('coffeeName').value.trim();
      if (!coffeeName) {
        alert("커피 이름을 입력해 주세요.");
        return;
      }

      const timestamp = new Date().toISOString().replace(/[-T:.Z]/g, "").slice(0, 14);

      // 1) 생두 고유 ID 계산 (Key)
      const beanKeyStr = [
        coffeeName,
        document.getElementById('supplier').value,
        document.getElementById('cropYear').value,
        document.getElementById('country').value,
        document.getElementById('farm').value,
        document.getElementById('producer').value,
        document.getElementById('regionUpper').value,
        document.getElementById('regionLower').value,
        document.getElementById('altitudeMin').value,
        document.getElementById('altitudeMax').value,
        document.getElementById('variety').value,
        document.getElementById('processMain').value,
        document.getElementById('processSub').value,
        document.querySelector('input[name="processFermentation"]:checked')?.value || ''
      ].map(s => String(s || '').trim().toLowerCase()).join('|');

      let beanId = document.getElementById('beanId').value;
      if (!beanId) {
        beanId = "BEAN_" + Math.abs(hashCode(beanKeyStr));
      }

      // 2) 측정 세트 ID
      let setId = document.getElementById('setId').value;
      if (!setId) {
        setId = "SET_" + timestamp;
      }

      // 3) Row ID
      let rowId = document.getElementById('currentRowId').value;
      if (!rowId) {
        rowId = "ROW_" + timestamp + "_01";
      }

      const rowObj = {
        "Row_ID": rowId,
        "측정 세트 ID": setId,
        "생두 고유 ID": beanId,
        "측정 회차": 1,
        "커피 이름": coffeeName,
        "수확연도": document.getElementById('cropYear').value,
        "공급사": document.getElementById('supplier').value,
        "측정일자": document.getElementById('measureDate').value,
        "측정목적": document.getElementById('measurePurpose').value,
        "국가": document.getElementById('country').value,
        "농장": document.getElementById('farm').value,
        "생산자": document.getElementById('producer').value,
        "상위 지역": document.getElementById('regionUpper').value,
        "하위 지역": document.getElementById('regionLower').value,
        "재배고도 범위 최저": document.getElementById('altitudeMin').value,
        "재배고도 범위 최고": document.getElementById('altitudeMax').value,
        "품종": document.getElementById('variety').value,
        "프로세싱 대분류": document.getElementById('processMain').value,
        "프로세싱 소분류": document.getElementById('processSub').value,
        "발효 타입": document.querySelector('input[name="processFermentation"]:checked')?.value || 'Aerobic',
        "프로세싱 비고": document.getElementById('processNotes').value,
        "감각 부피": parseInt(document.getElementById('sensoryVolume').value || 3, 10),
        "감각 경도": parseInt(document.getElementById('sensoryHardness').value || 3, 10)
      };

      fetch(GOOGLE_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: "saveData",
          isDraft: isDraft,
          rows: [rowObj]
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert(data.message);
          if (!isDraft) {
            location.reload();
          }
        } else {
          alert("저장 실패: " + data.message);
        }
      })
      .catch(err => {
        alert("오류 발생: " + err.toString());
      });
    }

    function hashCode(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return hash;
    }
  </script>
</body>
