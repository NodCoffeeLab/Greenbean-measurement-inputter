<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생두 물리 측정 결과 입력기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .active-chip { background-color: #059669 !important; color: white !important; border-color: #059669 !important; }
    .accordion-content { transition: max-height 0.3s ease-out; }
    .accordion-content.closed { max-height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; overflow: hidden !important; }
    .accordion-content:not(.closed) { overflow: visible !important; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .search-select-dropdown { max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 font-sans text-gray-800">

  <div class="max-w-md mx-auto px-4 pt-4">

    <!-- Header -->
    <header class="mb-4 flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold text-gray-900">생두 물리 측정 결과 입력기</h1>
      </div>
      <div class="flex gap-1.5">
        <button type="button" onclick="openDraftModal()" class="px-2.5 py-1 text-[11px] bg-emerald-50 text-emerald-700 font-bold rounded-lg border border-emerald-200 shadow-sm hover:bg-emerald-100">📁 임시저장</button>
        <button type="button" onclick="openBeanModal()" class="px-2.5 py-1 text-[11px] bg-blue-50 text-blue-700 font-bold rounded-lg border border-blue-200 shadow-sm hover:bg-blue-100">🔍 기존 정보</button>
      </div>
    </header>

    <form id="qcForm" onsubmit="return false;" class="space-y-3">
      <input type="hidden" id="currentSetId" value="">

      <!-- 1. 기본 정보 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span>1. 기본 정보</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2 text-xs">
          <div>
            <label class="block font-semibold mb-0.5">커피 이름 *</label>
            <input type="text" id="coffeeName" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none">
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">측정일자</label>
              <input type="date" id="measureDate" onchange="extractYearMonth()" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">측정연도</label>
              <input type="number" id="measureYear" class="w-full p-1.5 border rounded-lg bg-gray-50">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">측정월</label>
              <input type="number" id="measureMonth" class="w-full p-1.5 border rounded-lg bg-gray-50">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">수확연도</label>
              <input type="text" id="harvestYear" placeholder="2024/2025" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">측정목적</label>
              <input type="text" id="measurePurpose" placeholder="QC / 입고검사" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">공급사</label>
              <div class="relative">
                <input type="text" id="supplier_search" placeholder="검색 및 선택..." onclick="toggleSearchSelect('supplier_dropdown')" oninput="filterSearchSelect('supplier_search', 'supplier_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="supplier" value="">
                <div id="supplier_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-lg z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. 국가 및 생산지 정보 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span>2. 국가 및 생산지 정보</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2 text-xs">
          <div>
            <label class="block font-semibold mb-0.5">국가 *</label>
            <div class="relative">
              <input type="text" id="country_search" placeholder="국가 검색 및 선택..." onclick="toggleSearchSelect('country_dropdown')" oninput="filterSearchSelect('country_search', 'country_dropdown')" class="w-full p-2 border rounded-lg bg-white cursor-pointer">
              <input type="hidden" id="country" value="">
              <div id="country_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-lg z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">농장</label>
              <div class="relative">
                <input type="text" id="farm_search" placeholder="농장 선택..." onclick="checkCountryFirst('farm_dropdown')" oninput="filterSearchSelect('farm_search', 'farm_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="farm" value="">
                <div id="farm_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-lg z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
            <div>
              <label class="block font-semibold mb-0.5">농장 비고</label>
              <input type="text" id="farmNotes" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">생산자</label>
              <div class="relative">
                <input type="text" id="producer_search" placeholder="생산자 선택..." onclick="toggleSearchSelect('producer_dropdown')" oninput="filterSearchSelect('producer_search', 'producer_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="producer" value="">
                <div id="producer_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-lg z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
            <div>
              <label class="block font-semibold mb-0.5">생산자 비고</label>
              <input type="text" id="producerNotes" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">상위 지역</label>
              <div class="relative">
                <input type="text" id="regionUpper_search" placeholder="상위 지역..." onclick="checkCountryFirst('regionUpper_dropdown')" oninput="filterSearchSelect('regionUpper_search', 'regionUpper_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="regionUpper" value="">
                <div id="regionUpper_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-lg z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
            <div>
              <label class="block font-semibold mb-0.5">하위 지역</label>
              <div class="relative">
                <input type="text" id="regionLower_search" placeholder="하위 지역..." onclick="checkUpperRegionFirst('regionLower_dropdown')" oninput="filterSearchSelect('regionLower_search', 'regionLower_dropdown')" class="w-full p-1.5 border rounded-lg bg-white cursor-pointer">
                <input type="hidden" id="regionLower" value="">
                <div id="regionLower_dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-lg z-50 search-select-dropdown p-1 text-xs space-y-1"></div>
              </div>
            </div>
          </div>
          <div>
            <label class="block font-semibold mb-0.5">지역 비고</label>
            <input type="text" id="regionNotes" class="w-full p-1.5 border rounded-lg">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">재배고도 최저 (m)</label>
              <input type="number" id="altMin" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">재배고도 최고 (m)</label>
              <input type="number" id="altMax" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
        </div>
      </div>

      <!-- 3. 프로세싱 정보 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span>3. 프로세싱 정보</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2.5 text-xs">
          <div class="flex justify-between items-center bg-emerald-50 p-2 rounded-lg border border-emerald-200">
            <span id="selectedProcessSetText" class="font-bold text-emerald-800">선택된 프로세싱 세트 없음</span>
            <button type="button" onclick="openProcessSetModal()" class="px-2 py-1 bg-emerald-600 text-white font-bold rounded hover:bg-emerald-700 text-[11px]">⚙ 세트 불러오기</button>
          </div>
          <input type="hidden" id="processSet" value="">
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">대분류</label>
              <select id="processMain" class="w-full p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="Washed">Washed</option>
                <option value="Natural">Natural</option>
                <option value="Honey/PN">Honey/PN</option>
                <option value="Semi Washed/White Honey">Semi Washed/White Honey</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold mb-0.5">발효 타입</label>
              <select id="fermentationType" class="w-full p-1.5 border rounded-lg bg-white">
                <option value="Aerobic">Aerobic</option>
                <option value="Anaerobic">Anaerobic</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="font-semibold">소분류 (클릭 순서대로 배치됨)</label>
              <button type="button" onclick="clearSelectedSubChips()" class="text-[10px] text-red-600 font-bold">전체 해제</button>
            </div>
            <div id="subChipContainer" class="flex flex-wrap gap-1 mb-1.5 max-h-36 overflow-y-auto p-1.5 border rounded bg-gray-50">
              <span class="text-gray-400 text-[11px] py-1">DB 로딩 중...</span>
            </div>
            <div class="flex gap-1">
              <input type="text" id="customSubInput" placeholder="+ 직접 입력 후 태그 추가" class="flex-1 p-1 border rounded text-[11px]">
              <button type="button" onclick="addCustomSubChip()" class="px-2 py-1 bg-gray-700 text-white font-bold rounded text-[11px]">추가</button>
            </div>
          </div>

          <div>
            <label class="block font-semibold mb-0.5">프로세싱 비고</label>
            <input type="text" id="processNotes" class="w-full p-1.5 border rounded-lg">
          </div>
        </div>
      </div>

      <!-- 4. 품종 정보 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span>4. 품종 정보</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2.5 text-xs">
          <div class="flex justify-between items-center">
            <span class="font-bold text-gray-700">선택된 품종 목록:</span>
            <button type="button" onclick="clearSelectedVarietyChips()" class="text-[10px] text-red-600 font-bold">전체 해제</button>
          </div>
          <div id="selectedVarietyDisplay" class="p-2 border rounded-lg bg-gray-50 font-bold text-emerald-800 min-h-[36px] flex items-center flex-wrap gap-1">
            <span class="text-gray-400 font-normal">아래 목록에서 품종을 선택해 주세요.</span>
          </div>

          <!-- DB 품종 아코디언 컨테이너 -->
          <div id="varietyGroupContainer" class="space-y-1.5 max-h-80 overflow-y-auto pr-1">
            <span class="text-gray-400 text-[11px]">DB 로딩 중...</span>
          </div>

          <div class="pt-1">
            <button type="button" onclick="openAddVarietyModal()" class="w-full py-2 bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold rounded-lg text-xs hover:bg-emerald-100 flex justify-center items-center gap-1">
              <span>➕ 신규 품종 DB 등록</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 회차 제어바 (스티키 탭) -->
      <div class="sticky top-0 z-40 bg-emerald-900 text-white p-2 rounded-xl shadow-md flex justify-between items-center gap-2 text-xs">
        <div class="flex items-center gap-1 overflow-x-auto" id="runTabsHeader">
          <!-- Dynamically generated run buttons -->
        </div>
        <div class="flex gap-1 shrink-0">
          <button type="button" onclick="addRunTab()" class="px-2 py-1 bg-emerald-500 hover:bg-emerald-400 text-white font-bold rounded-lg text-[11px]">+ 회차 추가</button>
          <button type="button" onclick="removeRunTab()" class="px-2 py-1 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg text-[11px]">- 회차 삭제</button>
        </div>
      </div>

      <!-- 5. Omix 측정 데이터 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span id="label-omix">5. Omix 측정 데이터 (#1차)</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2 text-xs">
          <!-- 1행: 수분, 밀도, 추정 밀도 -->
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">수분 (%)</label>
              <input type="number" step="0.01" id="omixMoisture" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">밀도 (g/L)</label>
              <input type="number" step="0.1" id="omixDensity" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">추정 밀도 (g/L)</label>
              <input type="number" step="0.1" id="omixEstDensity" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
          <!-- 2행: 스크린 작음, 스크린 큼, 추정 부피 -->
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">스크린 작음</label>
              <input type="number" id="omixScreenSmall" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">스크린 큼</label>
              <input type="number" id="omixScreenLarge" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">추정 부피 (cm³)</label>
              <input type="number" step="0.1" id="omixEstVol" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
          <!-- 3행: 수분활성도, 빈 온도 -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">수분활성도 (aW)</label>
              <input type="number" step="0.001" id="omixAw" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">빈 온도 (°C)</label>
              <input type="number" step="0.1" id="omixBeanTemp" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
          <!-- 4행: 고정 환경 데이터 (회차 전환 시에도 유지) -->
          <div class="pt-2 border-t">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-gray-600 text-[11px]">🌡 환경 측정 데이터 (회차 간 자동 고정)</span>
              <button type="button" onclick="resetOmixEnvInputs()" class="text-[10px] text-gray-500 font-bold hover:text-red-600">🔄 초기화</button>
            </div>
            <div class="grid grid-cols-4 gap-1.5">
              <div>
                <label class="block text-[10px] text-gray-500">공기 온도</label>
                <input type="number" step="0.1" id="omixAirTemp" class="w-full p-1.5 border rounded-lg bg-emerald-50/50">
              </div>
              <div>
                <label class="block text-[10px] text-gray-500">습도 (%)</label>
                <input type="number" step="0.1" id="omixHumidity" class="w-full p-1.5 border rounded-lg bg-emerald-50/50">
              </div>
              <div>
                <label class="block text-[10px] text-gray-500">기압 (hPa)</label>
                <input type="number" step="0.1" id="omixPressure" class="w-full p-1.5 border rounded-lg bg-emerald-50/50">
              </div>
              <div>
                <label class="block text-[10px] text-gray-500">고도 (m)</label>
                <input type="number" id="omixAltitude" class="w-full p-1.5 border rounded-lg bg-emerald-50/50">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 6. CoffMeter M1 측정 데이터 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span id="label-m1">6. CoffMeter M1 측정 데이터 (#1차)</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2 text-xs">
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">수분 (%)</label>
              <input type="number" step="0.01" id="m1Moisture" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">밀도 (g/L)</label>
              <input type="number" step="0.1" id="m1Density" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">공기 온도 (°C)</label>
              <input type="number" step="0.1" id="m1AirTemp" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
        </div>
      </div>

      <!-- 7. Lighttells MD-500 측정 데이터 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span id="label-md500">7. Lighttells MD-500 측정 데이터 (#1차)</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2 text-xs">
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">수분 (%)</label>
              <input type="number" step="0.01" id="md500Moisture" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">밀도 (g/L)</label>
              <input type="number" step="0.1" id="md500Density" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">공기 온도 (°C)</label>
              <input type="number" step="0.1" id="md500AirTemp" class="w-full p-1.5 border rounded-lg">
            </div>
          </div>
        </div>
      </div>

      <!-- 8. Rotronic HygroLab 측정 데이터 -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
        <button type="button" class="w-full px-4 py-2.5 bg-gray-50 flex justify-between font-bold text-xs border-b rounded-t-xl" onclick="toggleAcc(this)">
          <span id="label-rotronic">8. Rotronic HygroLab 측정 데이터 (#1차)</span> <span class="arrow text-gray-400">▲</span>
        </button>
        <div class="accordion-content p-3 space-y-2 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-0.5">수분활성도 (aW)</label>
              <input type="number" step="0.001" id="rotronicAw" class="w-full p-1.5 border rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-0.5">온도 (°C)</label>

          <!-- 20알 실측 그리드 -->

      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-gray-800">📁 진행 중인 임시저장 목록</h3>
        <button type="button" onclick="closeDraftModal()" class="text-gray-400 font-bold hover:text-gray-600">✕</button>

      <div id="draftModalList" class="max-h-72 overflow-y-auto space-y-1.5 border p-2 rounded-lg bg-gray-50"></div>

  <script>
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbweqeTQLMbmCuCckojMxba4JN-6UbcB-HPiQXO0EoLgGl9w6ie_sAdUdQAzyUNyPQ/exec";

    let dbCache = {};
    let cachedProcessSets = [];
    let cachedExistingBeans = [];
    let cachedDrafts = [];
    let selectedVarietyQueue = [];
    let selectedSubQueue = [];

    // 회차 관리 구조
    let runsData = [{}];
    let currentRunIdx = 0;

    const deviceFieldIds = [
      'omixMoisture', 'omixDensity', 'omixEstDensity', 'omixScreenSmall', 'omixScreenLarge', 'omixEstVol', 'omixAw', 'omixBeanTemp',
      'm1Moisture', 'm1Density', 'm1AirTemp',
      'md500Moisture', 'md500Density', 'md500AirTemp',
      'rotronicAw', 'rotronicAwTemp'
    ];

    const persistentEnvFieldIds = [
      'omixAirTemp', 'omixHumidity', 'omixPressure', 'omixAltitude',
      'rotronicAwOffset', 'rotronicTempOffset'
    ];

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('measureDate').value = new Date().toISOString().substring(0, 10);
      extractYearMonth();
      build20BeanGrid();
      renderRunTabs();
      if (!GOOGLE_WEB_APP_URL.includes("여기에_")) {
        loadDBLists();
      }
    });

    function extractYearMonth() {
      const d = document.getElementById('measureDate').value;
      if (d) {
        const parts = d.split('-');
        if (parts.length >= 2) {
          document.getElementById('measureYear').value = parseInt(parts[0], 10);
          document.getElementById('measureMonth').value = parseInt(parts[1], 10);
        }
      }
    }

    function toggleAcc(btn) {
      const content = btn.nextElementSibling;
      const arrow = btn.querySelector('.arrow');
      content.classList.toggle('closed');
      arrow.textContent = content.classList.contains('closed') ? '▼' : '▲';
    }

    function stepSensory(id, delta) {
      const el = document.getElementById(id);
      if (!el) return;
      let val = parseInt(el.value, 10) || 3;
      val += delta;
      if (val < 1) val = 1;
      if (val > 5) val = 5;
      el.value = val;
    }

    // 회차 제어 관련 로직
    function renderRunTabs() {
      const container = document.getElementById('runTabsHeader');
      if (!container) return;
      container.innerHTML = '';
      runsData.forEach((_, idx) => {
        const isCurrent = idx === currentRunIdx;
        const activeClass = isCurrent ? 'bg-emerald-400 text-emerald-950 font-bold border-white shadow-sm' : 'bg-emerald-800 text-emerald-200 border-emerald-700 hover:bg-emerald-700';
        container.innerHTML += `
          <button type="button" onclick="switchRunTab(${idx})" class="px-2.5 py-1 rounded-lg text-xs border transition-all ${activeClass}">
            #${idx + 1}차 측정
          </button>
        `;
      });
      updateRunLabels();
    }

    function updateRunLabels() {
      const labelText = `(#${currentRunIdx + 1}차)`;
      document.getElementById('label-omix').textContent = `5. Omix 측정 데이터 ${labelText}`;
      document.getElementById('label-m1').textContent = `6. CoffMeter M1 측정 데이터 ${labelText}`;
      document.getElementById('label-md500').textContent = `7. Lighttells MD-500 측정 데이터 ${labelText}`;
      document.getElementById('label-rotronic').textContent = `8. Rotronic HygroLab 측정 데이터 ${labelText}`;
    }

    function saveCurrentRunInputs() {
      const currentObj = {};
      deviceFieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) currentObj[id] = el.value;
      });
      runsData[currentRunIdx] = currentObj;
    }

    function loadRunInputs(idx) {
      const dataObj = runsData[idx] || {};
      deviceFieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = dataObj[id] !== undefined ? dataObj[id] : '';
      });
    }

    function addRunTab() {
      saveCurrentRunInputs();
      runsData.push({});
      currentRunIdx = runsData.length - 1;
      renderRunTabs();
      loadRunInputs(currentRunIdx);
    }

    function removeRunTab() {
      if (runsData.length <= 1) {
        alert("최소 1개 회차는 유지되어야 합니다.");
        return;
      }
      runsData.splice(currentRunIdx, 1);
      currentRunIdx = Math.max(0, currentRunIdx - 1);
      renderRunTabs();
      loadRunInputs(currentRunIdx);
    }

    function switchRunTab(targetIdx) {
      saveCurrentRunInputs();
      currentRunIdx = targetIdx;
      renderRunTabs();
      loadRunInputs(targetIdx);
    }

    function resetOmixEnvInputs() {
      ['omixAirTemp', 'omixHumidity', 'omixPressure', 'omixAltitude'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
    }

    function resetRotronicOffsetInputs() {
      ['rotronicAwOffset', 'rotronicTempOffset'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
    }

    // 20알 개별 실측 그리드
    function build20BeanGrid() {
      const container = document.getElementById('bean-grid');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 1; i <= 20; i++) {
        container.innerHTML += `
          <div class="flex items-center gap-1.5 p-1.5 border rounded-lg bg-gray-50/50">
            <span class="w-7 font-bold text-gray-500 text-[11px] shrink-0">#${i}</span>
            <input type="number" step="0.01" id="bean${i}_len" placeholder="길이" class="w-1/4 p-1 border rounded text-[11px] bg-white">
            <input type="number" step="0.01" id="bean${i}_wid" placeholder="폭" class="w-1/4 p-1 border rounded text-[11px] bg-white">
            <input type="number" step="0.01" id="bean${i}_thk" placeholder="두께" class="w-1/4 p-1 border rounded text-[11px] bg-white">
            <input type="number" step="0.1" id="bean${i}_hrd" placeholder="경도" class="w-1/4 p-1 border rounded text-[11px] bg-white">
          </div>
        `;
      }
    }

    // DB 데이터 로드
    function loadDBLists() {
      fetch(`${GOOGLE_WEB_APP_URL}?action=getDB`)
        .then(res => res.json())
        .then(data => {
          dbCache = data || {};
          populateSearchSelectData('supplier_dropdown', data.supplier, 0, 'supplier');
          populateSearchSelectData('country_dropdown', data.country, 0, 'country', onCountryChange);
          populateSearchSelectData('farm_dropdown', data.farm, 1, 'farm');
          populateSearchSelectData('producer_dropdown', data.producer, 0, 'producer');
          populateSearchSelectData('regionUpper_dropdown', data.region, 1, 'regionUpper', onRegionUpperChange);
          populateSearchSelectData('regionLower_dropdown', data.region, 2, 'regionLower');

          renderVarietyGroupChips(data.variety);
          renderProcessSubChips(data.processing);
          onNewVarSpeciesChange();
        }).catch(err => console.error(err));
    }

    function toggleSearchSelect(dropdownId, forceState = null) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      if (forceState !== null) {
        dropdown.classList.toggle('hidden', !forceState);
      } else {
        dropdown.classList.toggle('hidden');
      }
    }

    function checkCountryFirst(dropdownId) {
      const cVal = document.getElementById('country').value.trim();
      if (!cVal) {
        alert("⚠ 국가를 먼저 선택해 주세요.");
        return;
      }
      toggleSearchSelect(dropdownId, true);
    }

    function checkUpperRegionFirst(dropdownId) {
      const cVal = document.getElementById('country').value.trim();
      const uVal = document.getElementById('regionUpper').value.trim();
      if (!cVal || !uVal) {
        alert("⚠ 국가 및 상위 지역을 먼저 선택해 주세요.");
        return;
      }
      toggleSearchSelect(dropdownId, true);
    }

    function filterSearchSelect(inputId, dropdownId) {
      const q = document.getElementById(inputId).value.trim().toLowerCase();
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      dropdown.classList.remove('hidden');
      const items = dropdown.children;

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const txt = item.textContent.trim().toLowerCase();
        if (txt.includes(q)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      }
    }

    function populateSearchSelectData(dropdownId, arr, colIdx, hiddenId, onSelectCallback = null) {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      dropdown.innerHTML = '';
      if (!arr || !Array.isArray(arr)) return;

      const set = new Set();
      for (let i = 1; i < arr.length; i++) {
        const val = String(arr[i][colIdx] || '').trim();
        if (val && !set.has(val)) {
          set.add(val);
          const item = document.createElement('div');
          item.className = 'p-1.5 hover:bg-emerald-50 cursor-pointer rounded font-medium text-gray-700';
          item.textContent = val;
          item.onclick = function() {
            document.getElementById(hiddenId + '_search').value = val;
            document.getElementById(hiddenId).value = val;
            toggleSearchSelect(dropdownId, false);
            if (onSelectCallback) onSelectCallback(val);
          };
          dropdown.appendChild(item);
        }
      }
    }

    function onCountryChange(cVal) {
      document.getElementById('farm_search').value = '';
      document.getElementById('farm').value = '';
      document.getElementById('regionUpper_search').value = '';
      document.getElementById('regionUpper').value = '';
      document.getElementById('regionLower_search').value = '';
      document.getElementById('regionLower').value = '';

      if (!dbCache.farm) return;
      populateFilteredFarmSelect(cVal);
      populateFilteredRegionUpperSelect(cVal);
    }

    function populateFilteredFarmSelect(cVal) {
      const dropdown = document.getElementById('farm_dropdown');
      dropdown.innerHTML = '';
      if (!dbCache.farm) return;

      for (let i = 1; i < dbCache.farm.length; i++) {
        const country = String(dbCache.farm[i][0] || '').trim().toLowerCase();
        const farmName = String(dbCache.farm[i][1] || '').trim();
        const producer = String(dbCache.farm[i][3] || '').trim();

        if (country === cVal.toLowerCase() && farmName) {
          const item = document.createElement('div');
          item.className = 'p-1.5 hover:bg-emerald-50 cursor-pointer rounded font-medium text-gray-700 flex justify-between';
          item.innerHTML = `<span>${farmName}</span> <span class="text-[10px] text-gray-400">${producer}</span>`;
          item.onclick = function() {
            document.getElementById('farm_search').value = farmName;
            document.getElementById('farm').value = farmName;
            toggleSearchSelect('farm_dropdown', false);
            if (producer) {
              document.getElementById('producer_search').value = producer;
              document.getElementById('producer').value = producer;
            }
          };
          dropdown.appendChild(item);
        }
      }
    }

    function populateFilteredRegionUpperSelect(cVal) {
      const dropdown = document.getElementById('regionUpper_dropdown');
      dropdown.innerHTML = '';
      if (!dbCache.region) return;

      const set = new Set();
      for (let i = 1; i < dbCache.region.length; i++) {
        const country = String(dbCache.region[i][0] || '').trim().toLowerCase();
        const upper = String(dbCache.region[i][1] || '').trim();

        if (country === cVal.toLowerCase() && upper && !set.has(upper)) {
          set.add(upper);
          const item = document.createElement('div');
          item.className = 'p-1.5 hover:bg-emerald-50 cursor-pointer rounded font-medium text-gray-700';
          item.textContent = upper;
          item.onclick = function() {
            document.getElementById('regionUpper_search').value = upper;
            document.getElementById('regionUpper').value = upper;
            toggleSearchSelect('regionUpper_dropdown', false);
            onRegionUpperChange(upper);
          };
          dropdown.appendChild(item);
        }
      }
    }

    function onRegionUpperChange(upperVal) {
      const cVal = document.getElementById('country').value.trim().toLowerCase();
      const dropdown = document.getElementById('regionLower_dropdown');
      dropdown.innerHTML = '';
      if (!dbCache.region) return;

      const set = new Set();
      for (let i = 1; i < dbCache.region.length; i++) {
        const country = String(dbCache.region[i][0] || '').trim().toLowerCase();
        const upper = String(dbCache.region[i][1] || '').trim().toLowerCase();
        const lower = String(dbCache.region[i][2] || '').trim();

        if (country === cVal && upper === upperVal.toLowerCase() && lower && !set.has(lower)) {
          set.add(lower);
          const item = document.createElement('div');
          item.className = 'p-1.5 hover:bg-emerald-50 cursor-pointer rounded font-medium text-gray-700';
          item.textContent = lower;
          item.onclick = function() {
            document.getElementById('regionLower_search').value = lower;
            document.getElementById('regionLower').value = lower;
            toggleSearchSelect('regionLower_dropdown', false);
          };
          dropdown.appendChild(item);
        }
      }
    }

    // 품종 DB 접이식 아코디언 동적 렌더링
    function renderVarietyGroupChips(varietyArr) {
      const container = document.getElementById('varietyGroupContainer');
      if (!container) return;
      container.innerHTML = '';

      if (!varietyArr || !Array.isArray(varietyArr) || varietyArr.length <= 1) {
        container.innerHTML = '<div class="text-xs text-gray-400 p-2">DB_품종 시트에 등록된 데이터가 없습니다.</div>';
        return;
      }

      const groups = {};

      for (let i = 1; i < varietyArr.length; i++) {
        const vName = String(varietyArr[i][0] || '').trim();
        const species = String(varietyArr[i][1] || '').trim() || 'Arabica';
        if (!vName) continue;

        let groupKey = species;
        if (species.toLowerCase() === 'arabica') {
          const firstChar = vName.charAt(0).toUpperCase();
          if (/[0-9]/.test(firstChar)) {
            groupKey = 'Arabica 0-9';
          } else if (/[A-Z]/.test(firstChar)) {
            groupKey = 'Arabica ' + firstChar;
          } else {
            groupKey = 'Arabica 기타';
          }
        }

        if (!groups[groupKey]) groups[groupKey] = [];
        if (!groups[groupKey].includes(vName)) groups[groupKey].push(vName);
      }

      const sortedKeys = Object.keys(groups).sort((a, b) => a.localeCompare(b));

      sortedKeys.forEach(groupKey => {
        const items = groups[groupKey].sort((a, b) => a.localeCompare(b));
        
        const details = document.createElement('details');
        details.className = 'border rounded-lg bg-white overflow-hidden shadow-sm text-xs';
        
        const summary = document.createElement('summary');
        summary.className = 'px-3 py-2 font-bold text-gray-800 bg-gray-50 hover:bg-emerald-50 cursor-pointer flex justify-between items-center select-none';
        summary.innerHTML = `<span>🏷 ${groupKey} <span class="text-[10px] text-gray-400 font-normal">(${items.length})</span></span>`;
        
        const contentBox = document.createElement('div');
        contentBox.className = 'flex flex-wrap gap-1 p-2 bg-white border-t';

        items.forEach(vName => {
          createVarietyChipElement(vName, contentBox);
        });

        details.appendChild(summary);
        details.appendChild(contentBox);
        container.appendChild(details);
      });
    }

    function createVarietyChipElement(val, container) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'variety-chip px-2 py-1 border rounded-lg text-[11px] bg-white text-gray-700 font-medium hover:bg-emerald-50 transition-all';
      btn.dataset.val = val;
      btn.textContent = val;
      btn.onclick = function() { toggleVarietyChipQueue(this); };
      container.appendChild(btn);
    }

    function toggleVarietyChipQueue(btn) {
      const val = btn.dataset.val;
      const idx = selectedVarietyQueue.indexOf(val);
      if (idx > -1) {
        selectedVarietyQueue.splice(idx, 1);
        btn.classList.remove('active-chip');
      } else {
        selectedVarietyQueue.push(val);
        btn.classList.add('active-chip');
      }
      updateVarietyDisplay();
    }

    function updateVarietyDisplay() {
      const display = document.getElementById('selectedVarietyDisplay');
      if (selectedVarietyQueue.length === 0) {
        display.innerHTML = '<span class="text-gray-400 font-normal">아래 목록에서 품종을 선택해 주세요.</span>';
      } else {
        display.innerHTML = selectedVarietyQueue.map(v => `<span class="px-2 py-0.5 bg-emerald-600 text-white rounded-md text-[11px] font-bold">${v}</span>`).join('');
      }
    }

    function clearSelectedVarietyChips() {
      selectedVarietyQueue = [];
      document.querySelectorAll('.variety-chip').forEach(b => b.classList.remove('active-chip'));
      updateVarietyDisplay();
    }

    function openAddVarietyModal() {
      document.getElementById('varietyModal').classList.remove('hidden');
    }
    function closeAddVarietyModal() {
      document.getElementById('varietyModal').classList.add('hidden');
    }

    function onNewVarSpeciesChange() {
      const species = document.getElementById('newVarSpecies').value.trim().toLowerCase();
      const groupSel = document.getElementById('newVarGroup');
      groupSel.innerHTML = '';

      if (!dbCache.variety) return;
      const set = new Set();

      for (let i = 1; i < dbCache.variety.length; i++) {
        const rowSpecies = String(dbCache.variety[i][1] || '').trim().toLowerCase();
        const rowGroup = String(dbCache.variety[i][2] || '').trim();

        if (rowSpecies === species && rowGroup && !set.has(rowGroup)) {
          set.add(rowGroup);
          groupSel.innerHTML += `<option value="${rowGroup}">${rowGroup}</option>`;
        }
      }
      if (set.size === 0) {
        groupSel.innerHTML = `<option value="Ethiopia">Ethiopia</option><option value="Typica/Bourbon">Typica/Bourbon</option><option value="Hybrid">Hybrid</option><option value="Unknown">Unknown</option>`;
      }
    }

    function saveNewVarietyToDB() {
      const name = document.getElementById('newVarName').value.trim();
      const species = document.getElementById('newVarSpecies').value;
      const group = document.getElementById('newVarGroup').value;
      const notes = document.getElementById('newVarNotes').value.trim();

      if (!name) {
        alert("⚠ 품종명을 입력해 주세요.");
        return;
      }

      fetch(GOOGLE_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: "addVariety",
          varietyData: { name: name, species: species, group: group, notes: notes }
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          alert("🎉 신규 품종이 성공적으로 DB에 저장되었습니다.");
          closeAddVarietyModal();
          loadDBLists();
        }
      });
    }

    // 프로세싱 세트 불러오기 팝업 모달
    function openProcessSetModal() {
      document.getElementById('processSetModal').classList.remove('hidden');
      if (cachedProcessSets.length === 0) {
        fetch(`${GOOGLE_WEB_APP_URL}?action=getProcessSets`)
          .then(res => res.json())
          .then(data => {
            cachedProcessSets = data || [];
            filterProcessSetModalList();
          });
      } else {
        filterProcessSetModalList();
      }
    }

    function closeProcessSetModal() {
      document.getElementById('processSetModal').classList.add('hidden');
    }

    function filterProcessSetModalList() {
      const q = document.getElementById('processSetSearch').value.trim().toLowerCase();
      const filtered = cachedProcessSets.filter(s => {
        return (s.setName && s.setName.toLowerCase().includes(q)) || (s.notes && s.notes.toLowerCase().includes(q));
      });
      renderProcessSetModalList(filtered);
    }

    function renderProcessSetModalList(list) {
      const container = document.getElementById('processSetModalList');
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-gray-400">등록된 프로세싱 세트가 없습니다.</div>`;
        return;
      }

      list.forEach((s, idx) => {
        const setTitle = s.setName || [s.mainCat, s.subCat, s.fermType].filter(Boolean).join(' | ');
        const subDetails = [s.mainCat, s.subCat, s.fermType].filter(Boolean).join(' | ');

        container.innerHTML += `
          <div onclick="selectProcessSetFromModal(${idx})" class="p-2.5 bg-white rounded-lg border hover:bg-emerald-50 cursor-pointer space-y-1 transition-all shadow-sm">
            <div class="font-bold text-emerald-800 text-xs">${setTitle}</div>
            <div class="text-[10px] text-gray-500 flex justify-between">
              <span>${subDetails}</span>
              <span class="text-gray-400">${s.notes || ''}</span>
            </div>
          </div>
        `;
      });
    }

    function selectProcessSetFromModal(idx) {
      const s = cachedProcessSets[idx];
      if (!s) return;
      document.getElementById('processMain').value = s.mainCat || "";
      setSelectedProcessSub(s.subCat || "");
      document.getElementById('fermentationType').value = s.fermType || "Aerobic";
      document.getElementById('processNotes').value = s.notes || "";
      document.getElementById('selectedProcessSetText').textContent = s.setName;
      document.getElementById('processSet').value = s.setName;
      closeProcessSetModal();
    }

    function renderProcessSubChips(arr) {
      const container = document.getElementById('subChipContainer');
      if (!container || !arr || !Array.isArray(arr)) return;
      container.innerHTML = '';
      const set = new Set();
      
      const items = [];
      for (let i = 1; i < arr.length; i++) {
        const subVal = String(arr[i][1] || '').trim();
        if (subVal && subVal.toLowerCase() !== 'anaerobic' && !set.has(subVal)) {
          set.add(subVal);
          items.push(subVal);
        }
      }

      items.sort((a, b) => a.localeCompare(b));
      items.forEach(subVal => createSubChipElement(subVal, container));
    }

    function createSubChipElement(val, container) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sub-chip px-2 py-1 border rounded-lg text-[11px] bg-gray-100 text-gray-700 font-medium transition-all';
      btn.dataset.val = val;
      btn.textContent = val;
      btn.onclick = function() { toggleSubChipQueue(this); };
      container.appendChild(btn);
    }

    function toggleSubChipQueue(btn) {
      const val = btn.dataset.val;
      const idx = selectedSubQueue.indexOf(val);
      if (idx > -1) {
        selectedSubQueue.splice(idx, 1);
        btn.classList.remove('active-chip');
      } else {
        selectedSubQueue.push(val);
        btn.classList.add('active-chip');
      }
    }

    function addCustomSubChip() {
      const val = document.getElementById('customSubInput').value.trim();
      if (!val) return;
      const container = document.getElementById('subChipContainer');
      createSubChipElement(val, container);
      const newBtn = container.lastElementChild;
      toggleSubChipQueue(newBtn);
      document.getElementById('customSubInput').value = '';
    }

    function clearSelectedSubChips() {
      selectedSubQueue = [];
      document.querySelectorAll('.sub-chip').forEach(b => b.classList.remove('active-chip'));
    }

    function setSelectedProcessSub(str) {
      clearSelectedSubChips();
      if (!str) return;
      const list = String(str).split(',').map(s => s.trim());
      list.forEach(val => {
        let btn = document.querySelector(`.sub-chip[data-val="${val}"]`);
        if (btn && !selectedSubQueue.includes(val)) {
          selectedSubQueue.push(val);
          btn.classList.add('active-chip');
        }
      });
    }

    // 불러오기 및 제출 처리
    function submitData(statusMode) {
      if (GOOGLE_WEB_APP_URL.includes("여기에_")) {
        alert("🛑 GOOGLE_WEB_APP_URL을 등록해 주세요.");
        return;
      }
      const coffeeName = document.getElementById('coffeeName').value.trim();
      if (!coffeeName) {
        alert("⚠ 커피 이름을 입력해 주세요.");
        return;
      }

      saveCurrentRunInputs();

      // 세트 단위 공통 메타데이터
      const commonFields = {
        "커피 이름": coffeeName,
        "측정일자": document.getElementById('measureDate').value,
        "측정연도": document.getElementById('measureYear').value,
        "측정월": document.getElementById('measureMonth').value,
        "수확연도": document.getElementById('harvestYear').value,
        "측정목적": document.getElementById('measurePurpose').value,
        "공급사": document.getElementById('supplier').value,
        "국가": document.getElementById('country').value,
        "농장": document.getElementById('farm').value,
        "농장 비고": document.getElementById('farmNotes').value,
        "생산자": document.getElementById('producer').value,
        "생산자 비고": document.getElementById('producerNotes').value,
        "상위 지역": document.getElementById('regionUpper').value,
        "하위 지역": document.getElementById('regionLower').value,
        "지역 비고": document.getElementById('regionNotes').value,
        "재배고도 범위 최저": document.getElementById('altMin').value,
        "재배고도 범위 최고": document.getElementById('altMax').value,
        "품종": selectedVarietyQueue.join(', '),
        "프로세싱 대분류": document.getElementById('processMain').value,
        "프로세싱 소분류": selectedSubQueue.join(', '),
        "발효 타입": document.getElementById('fermentationType').value,
        "프로세싱 비고": document.getElementById('processNotes').value,
        "감각 부피": document.getElementById('sensoryVol').value,
        "감각 경도": document.getElementById('sensoryHard').value
      };

      // 지속성 환경 및 오프셋 데이터
      persistentEnvFieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          const keyMap = {
            'omixAirTemp': 'Omix 공기 온도',
            'omixHumidity': 'Omix 습도',
            'omixPressure': 'Omix 기압',
            'omixAltitude': 'Omix 고도',
            'rotronicAwOffset': 'Rotronic 수분활성도 오프셋',
            'rotronicTempOffset': 'Rotronic 오프셋 온도'
          };
          if (keyMap[id]) commonFields[keyMap[id]] = el.value;
        }
      });

      // 20알 개별 실측 데이터
      for (let i = 1; i <= 20; i++) {
        commonFields[`실측 생두${i} 길이`] = document.getElementById(`bean${i}_len`).value;
        commonFields[`실측 생두${i} 폭`] = document.getElementById(`bean${i}_wid`).value;
        commonFields[`실측 생두${i} 두께`] = document.getElementById(`bean${i}_thk`).value;
        commonFields[`실측 생두${i} 경도`] = document.getElementById(`bean${i}_hrd`).value;
      }

      // 회차별 장비 측정 데이터 조합
      const runsPayload = runsData.map(runObj => {
        const fullRun = { ...commonFields };
        const keyMap = {
          'omixMoisture': 'Omix 수분',
          'omixDensity': 'Omix 밀도',
          'omixEstDensity': 'Omix 추정 밀도',
          'omixScreenSmall': 'Omix 스크린 사이즈 작음',
          'omixScreenLarge': 'Omix 스크린 사이즈 큼',
          'omixEstVol': 'Omix 추정 부피',
          'omixAw': 'Omix 수분활성도',
          'omixBeanTemp': 'Omix 빈 온도',
          'm1Moisture': 'M1 수분',
          'm1Density': 'M1 밀도',
          'm1AirTemp': 'M1 공기 온도',
          'md500Moisture': 'MD-500 수분',
          'md500Density': 'MD-500 밀도',
          'md500AirTemp': 'MD-500 공기 온도',
          'rotronicAw': 'Rotronic 수분활성도',
          'rotronicAwTemp': 'Rotronic 수분활성도 온도'
        };
        deviceFieldIds.forEach(id => {
          if (keyMap[id]) fullRun[keyMap[id]] = runObj[id] !== undefined ? runObj[id] : '';
        });
        return fullRun;
      });

      const currentSetId = document.getElementById('currentSetId').value || ("SET_" + Date.now());

      fetch(GOOGLE_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          status: statusMode,
          setId: currentSetId,
          runs: runsPayload
        })
      })
      .then(res => res.text())
      .then(resText => {
        if (resText.includes("Success")) {
          alert(statusMode === 'Draft' ? "💾 성공적으로 임시저장되었습니다." : "🎉 데이터가 성공적으로 저장되었습니다!");
          if (statusMode === 'Completed') {
            location.reload();
          }
        } else {
          alert("🛑 저장 실패: " + resText);
        }
      }).catch(err => {
        alert("🛑 오류 발생: " + err.message);
      });
    }

    function openDraftModal() {
      document.getElementById('draftModal').classList.remove('hidden');
      fetch(`${GOOGLE_WEB_APP_URL}?action=getDrafts`)
        .then(res => res.json())
        .then(data => {
          cachedDrafts = data.drafts || [];
          renderDraftModalList(cachedDrafts);
        });
    }
    function closeDraftModal() {
      document.getElementById('draftModal').classList.add('hidden');
    }

    function renderDraftModalList(list) {
      const container = document.getElementById('draftModalList');
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-gray-400">진행 중인 임시저장 항목이 없습니다.</div>`;
        return;
      }
      list.forEach(item => {
        const f = item.fields || {};
        container.innerHTML += `
          <div onclick="loadDraftItem('${item.setId}')" class="p-2.5 bg-white rounded-lg border hover:bg-emerald-50 cursor-pointer flex justify-between items-center transition-all shadow-sm">
            <div>
              <div class="font-bold text-gray-800">${f["커피 이름"] || '이름 없음'}</div>
              <div class="text-[10px] text-gray-400">${f["국가"] || ''} ${f["농장"] || ''} • ${f["측정일자"] || ''}</div>
            </div>
            <span class="text-[10px] text-emerald-600 font-bold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">불러오기</span>
          </div>
        `;
      });
    }

    function loadDraftItem(setId) {
      const target = cachedDrafts.find(d => d.setId === setId);
      if (!target) return;
      const b = target.fields || {};
      
      document.getElementById('currentSetId').value = setId;
      document.getElementById('coffeeName').value = b["커피 이름"] || "";
      document.getElementById('measureDate').value = b["측정일자"] || "";
      document.getElementById('harvestYear').value = b["수확연도"] || "";
      document.getElementById('country_search').value = b["국가"] || "";
      document.getElementById('country').value = b["국가"] || "";
      document.getElementById('farm_search').value = b["농장"] || "";
      document.getElementById('farm').value = b["농장"] || "";
      
      closeDraftModal();
      alert("✅ 임시저장 데이터를 불러왔습니다.");
    }

    function openBeanModal() {
      document.getElementById('beanModal').classList.remove('hidden');
      if (cachedExistingBeans.length === 0) {
        fetch(`${GOOGLE_WEB_APP_URL}?action=getExistingBeans`)
          .then(res => res.json())
          .then(data => {
            cachedExistingBeans = data || [];
            filterBeanModalList();
          });
      } else {
        filterBeanModalList();
      }
    }
    function closeBeanModal() {
      document.getElementById('beanModal').classList.add('hidden');
    }

    function filterBeanModalList() {
      const q = document.getElementById('beanSearch').value.trim().toLowerCase();
      const filtered = cachedExistingBeans.filter(b => {
        return (b["커피 이름"] && b["커피 이름"].toLowerCase().includes(q)) || (b["국가"] && b["국가"].toLowerCase().includes(q));
      });
      renderBeanModalList(filtered);
    }

    function renderBeanModalList(list) {
      const container = document.getElementById('beanModalList');
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-gray-400">등록된 기존 생두 정보가 없습니다.</div>`;
        return;
      }
      list.forEach((b, idx) => {
        container.innerHTML += `
          <div onclick="selectBeanFromModal(${idx})" class="p-2.5 bg-white rounded-lg border hover:bg-emerald-50 cursor-pointer space-y-0.5 transition-all shadow-sm">
            <div class="font-bold text-gray-800 text-xs">${b["커피 이름"]}</div>
            <div class="text-[10px] text-gray-500">${b["국가"] || ''} | ${b["농장"] || ''} | ${b["품종_표시"] || b["품종"] || ''}</div>
          </div>
        `;
      });
    }

    function selectBeanFromModal(idx) {
      const b = cachedExistingBeans[idx];
      if (!b) return;

      document.getElementById('coffeeName').value = b["커피 이름"] || "";
      document.getElementById('harvestYear').value = b["수확연도"] || "";
      document.getElementById('supplier').value = b["공급사"] || "";
      document.getElementById('supplier_search').value = b["공급사"] || "";

      document.getElementById('country').value = b["국가"] || "";
      document.getElementById('country_search').value = b["국가"] || "";

      document.getElementById('farm').value = b["농장"] || "";
      document.getElementById('farm_search').value = b["농장"] || "";

      document.getElementById('processMain').value = b["프로세싱 대분류"] || "";
      setSelectedProcessSub(b["프로세싱 소분류"] || "");
      document.getElementById('fermentationType').value = b["발효 타입"] || "Aerobic";
      document.getElementById('processNotes').value = b["프로세싱 비고"] || "";

      document.getElementById('altMin').value = b["재배고도 범위 최저"] || "";
      document.getElementById('altMax').value = b["재배고도 범위 최고"] || "";

      document.getElementById('currentSetId').value = "";
      closeBeanModal();
      alert("✅ 기존 생두 정보가 자동 입력되었습니다.");
    }
  </script>
</body>
